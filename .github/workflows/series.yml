name: Mega Extrair Series (Lotes de 100)

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:
    inputs:
      lote:
        description: 'URLs para visitar por run'
        required: false
        default: '100'
        type: string
      reprocessar_tudo:
        description: 'Limpar fila e começar do zero?'
        required: false
        default: false
        type: boolean
      modo:
        description: 'O que o robô deve fazer?'
        required: true
        default: 'baixar_e_consertar'
        type: choice
        options:
          - baixar_e_consertar
          - apenas_consertar
          - apenas_baixar
      auto_run:
        description: 'Ativar auto-chain?'
        required: false
        default: true
        type: boolean
      delay_entre_seg:
        description: 'Segundos de espera entre um episódio/série e outro'
        required: false
        default: '30'
        type: string
      retry_429_seg:
        description: 'Base do backoff quando o site devolve 429'
        required: false
        default: '60'
        type: string

permissions:
  contents: write

concurrency:
  group: mega-series
  cancel-in-progress: false

jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Limpar arquivos de controle (Opcional)
        if: ${{ inputs.reprocessar_tudo == true || inputs.reprocessar_tudo == 'true' }}
        run: |
          rm -f series_fila.txt series_feitas.txt series_consertadas.txt episodios_pendentes.json series_descartados.txt series_erros.json

      - name: Instalar Python e Playwright
        run: |
          pip install playwright beautifulsoup4 requests
          playwright install --with-deps chromium

      - name: Extrair Series e Retentar Falhas
        env:
          LOTE_SIZE: ${{ inputs.lote || '100' }}
          MODO_EXECUCAO: ${{ inputs.modo || 'baixar_e_consertar' }}
          DELAY_ENTRE_SEG: ${{ inputs.delay_entre_seg || '30' }}
          RETRY_429_SEG: ${{ inputs.retry_429_seg || '60' }}
        run: |
          cat > /tmp/mega_series.py << 'PYEOF'
          import requests, sys, os, json, time, random, asyncio, re, base64, unicodedata
          import html as htmllib
          from pathlib import Path
          from urllib.parse import urlparse, urljoin
          from bs4 import BeautifulSoup

          BASE_URL = "https://www.vini7xgrave.site"
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
          PAGES_URL = "https://api-pobreflix-filmes.pages.dev"
          PLACEHOLDER = "https://placehold.co/500x750?text=Sem+Capa"
          SUFIXO = "🍿Clau"
          MARCADOR_FORMATO = 'data-rave="2"'

          MAX_TENTATIVAS = 6
          LOTE_SIZE = int(os.environ.get("LOTE_SIZE") or 100)
          MODO = (os.environ.get("MODO_EXECUCAO") or "baixar_e_consertar").lower()
          FALTAM_ARQ = Path(os.environ.get("FALTAM_FILE") or "/tmp/faltam.txt")
          
          DELAY_ENTRE     = float(os.environ.get("DELAY_ENTRE_SEG") or 30)
          DELAY_JITTER    = float(os.environ.get("DELAY_JITTER_SEG") or 8)
          RETRY_429_BASE  = float(os.environ.get("RETRY_429_SEG") or 60)
          HTTP_TENTATIVAS = int(os.environ.get("HTTP_TENTATIVAS") or 5)

          METRICAS_429 = 0

          def log(*a): print(*a, flush=True)

          def ler_linhas(arq):
              arq = Path(arq)
              if not arq.exists(): return []
              vistos, saida = set(), []
              for linha in arq.read_text(encoding="utf-8").splitlines():
                  linha = linha.strip()
                  if linha and linha not in vistos:
                      vistos.add(linha)
                      saida.append(linha)
              return saida

          def escrever_linhas(arq, linhas):
              arq = Path(arq)
              tmp = arq.with_name(arq.name + ".tmp")
              tmp.write_text("\n".join(linhas) + ("\n" if linhas else ""), encoding="utf-8")
              tmp.replace(arq)

          def buscar_urls_feed():
              urls, vistos = [], set()
              start, completo = 1, True
              while True:
                  url_feed = f"{BASE_URL}/feeds/posts/default?alt=json&max-results=150&start-index={start}"
                  entries = None
                  for tentativa in range(3):
                      try:
                          r = requests.get(url_feed, headers=HEADERS, timeout=20)
                          if r.status_code == 200:
                              entries = r.json().get("feed", {}).get("entry", [])
                              break
                          log(f"Feed HTTP {r.status_code} (tentativa {tentativa + 1}/3)")
                      except Exception as e:
                          log(f"Erro ao buscar feed: {e} (tentativa {tentativa + 1}/3)")
                      time.sleep(15 * (tentativa + 1) + random.uniform(0, 5))
                  if entries is None:
                      completo = False
                      break
                  if not entries: break
                  for e in entries:
                      link = next((l["href"] for l in e.get("link", []) if l.get("rel") == "alternate"), None)
                      if link:
                          u = link.split("?")[0].strip()
                          if u and u not in vistos:
                              vistos.add(u)
                              urls.append(u)
                  start += 150
                  if len(entries) < 150: break
              return urls, completo

          def validar_html(html, url):
              if not html or len(html) < 1000:
                  log(f"    (HTML inválido/curto para {url} - {len(html)} bytes)")
                  return False
              soup = BeautifulSoup(html, 'html.parser')
              if not soup.find('title') and not soup.find('h1'):
                  log(f"    (HTML sem título/h1 para {url})")
                  return False
              return True

          def http_get(url, timeout=25, tentativas=None):
              global METRICAS_429
              tentativas = tentativas or HTTP_TENTATIVAS
              ultimo = "erro desconhecido"
              for i in range(tentativas):
                  try:
                      r = requests.get(url, headers=HEADERS, timeout=timeout)
                      if r.status_code == 429:
                          METRICAS_429 += 1
                          ra = r.headers.get("Retry-After")
                          espera = float(ra.strip()) if (ra and ra.strip().isdigit()) else RETRY_429_BASE * (2 ** i) + random.uniform(0, 8)
                          log(f"    429 (tentativa {i+1}/{tentativas}): aguardando {espera:.0f}s...")
                          time.sleep(espera)
                          ultimo = "HTTP 429"
                          continue
                      if r.status_code in (500, 502, 503, 504):
                          espera = 15 * (i + 1) + random.uniform(0, 5)
                          time.sleep(espera)
                          ultimo = f"HTTP {r.status_code}"
                          continue
                      return r.status_code, r.text
                  except Exception as e:
                      time.sleep(6 * (i + 1) + random.uniform(0, 3))
                      ultimo = str(e)
              if ultimo == "HTTP 429": return 429, ""
              return None, ultimo

          async def renderizar(context, url, espera=5.0):
              page = await context.new_page()
              html = ""
              try:
                  await page.goto(url, wait_until="domcontentloaded", timeout=25000)
                  await asyncio.sleep(espera)
                  html = await page.content()
              except Exception:
                  try: html = await page.content()
                  except Exception: html = ""
              finally:
                  try: await page.close()
                  except Exception: pass
              return html

          def carregar_json(arq, padrao):
              try: return json.loads(Path(arq).read_text(encoding="utf-8"))
              except Exception: return padrao

          def salvar_json(arq, dados):
              Path(arq).write_text(json.dumps(dados, ensure_ascii=False, indent=2), encoding="utf-8")

          def carregar_pendentes(arq):
              por_arquivo = {}
              for p in carregar_json(arq, []):
                  if not isinstance(p, dict) or "arquivo" not in p: continue
                  if p["arquivo"] in por_arquivo:
                      ant = por_arquivo[p["arquivo"]]
                      ant["tentativas"] = max(ant.get("tentativas", 1), p.get("tentativas", 1))
                  else:
                      p.setdefault("tentativas", 1)
                      por_arquivo[p["arquivo"]] = p
              return list(por_arquivo.values())

          def anexar_linha(arq, linha):
              with open(arq, "a", encoding="utf-8") as f: f.write(linha.strip() + "\n")

          def ler_ld(soup):
              for s in soup.find_all("script", type="application/ld+json"):
                  try: dados = json.loads(s.string or s.get_text())
                  except Exception: continue
                  pilha = dados if isinstance(dados, list) else [dados]
                  for item in pilha:
                      if not isinstance(item, dict): continue
                      if isinstance(item.get("@graph"), list):
                          for sub in item["@graph"]:
                              if isinstance(sub, dict): yield sub
                      yield item

          def como_lista(v):
              if isinstance(v, str): return [v]
              if isinstance(v, dict): return como_lista(v.get("url"))
              if isinstance(v, list):
                  saida = []
                  for x in v: saida.extend(como_lista(x))
                  return saida
              return []

          _PREFIXO = re.compile(r"^(?:(?i:marc[øo]s\s*x\s*7|vini\s*7x)|(?:(?i:entre[ _-]nos|inix)|arc)(?=[\s\-_:|]))[\s\-_:|]*")
          _ANO_RE = r"(?<!\d)(?:19|20)\d{2}(?!\d)"

          def ano_da_url(url):
              m = re.search(r"/([^/?#]+?)(?:\.html)?(?:[?#].*)?$", url or "")
              if not m: return ""
              anos = re.findall(_ANO_RE, m.group(1))
              return anos[-1] if anos else ""

          def extrair_ano(titulo_bruto, url):
              ano = ano_da_url(url)
              if ano: return ano
              m = re.search(r"\(\s*((?:19|20)\d{2})\s*\)", str(titulo_bruto or ""))
              return m.group(1) if m else ""

          def _titulo_pela_url(url):
              m = re.search(r"/([^/?#]+?)\.html", url or "")
              if not m: return ""
              slug = m.group(1)
              slug = re.sub(r"^(?:inix|arc|entre-nos)[-_]", "", slug, flags=re.I)
              slug = re.sub(r"[-_]\d{4}$", "", slug)
              palavras = slug.replace("-", " ").replace("_", " ").split()
              return " ".join(p[:1].upper() + p[1:] for p in palavras)

          def limpar_titulo_bruto(titulo, url="", fallback=True):
              t = str(titulo or "")
              if re.search(r"https?:|\.html?\b", t, re.I): t = ""
              t = unicodedata.normalize("NFKC", t).replace(SUFIXO, "")
              t = re.sub(r"👾|vini\s*7x|vini7x", "", t, flags=re.I)
              t = re.sub(r"\s+", " ", t).strip(" -–—|:")

              for _ in range(3):
                  novo = _PREFIXO.sub("", t, count=1).strip(" -–—|:_")
                  if novo == t: break
                  t = novo

              t = re.sub(r"^(?:assistir|baixar|download)\s+", "", t, flags=re.I)
              t = re.sub(r"\s*[-–—|]\s*(?:assistir|online|filme|completo|dublado|legendado|hd|temporada|serie|série|download).*$", "", t, flags=re.I)
              t = re.sub(r"(?:\s+(?:dublado|legendado|online|completo))+$", "", t, flags=re.I)
              t = re.sub(r"\s*[-–—]\s*(?:\d+\s*[ªº°ao]?\s*)?(?:temporada|season)\b.*$", "", t, flags=re.I)
              t = re.sub(r"\s+\d+\s*[ªº°ao]\s*temporada\b.*$", "", t, flags=re.I)

              ano_url = ano_da_url(url)
              for _ in range(3):
                  novo = re.sub(r"\s*\(\s*(?:19|20)\d{2}\s*\)\s*$", "", t)
                  if ano_url: novo = re.sub(r"\s+" + ano_url + r"\s*$", "", novo)
                  novo = novo.strip(" -–—|:")
                  if novo == t: break
                  t = novo

              if len(t) < 3 and fallback: t = _titulo_pela_url(url)
              return t.strip()

          def candidatos_titulo(soup):
              c = []
              h1 = soup.find("h1", class_="post-title") or soup.find("h1")
              if h1: c.append(h1.get_text(" ", strip=True))
              og = soup.find("meta", property="og:title")
              if og and og.get("content"): c.append(og["content"])
              if soup.title and soup.title.string: c.append(soup.title.string)
              return c

          def escolher_titulo(soup, url):
              for raw in candidatos_titulo(soup):
                  t = limpar_titulo_bruto(raw, url, fallback=False)
                  if len(t) >= 3: return t, extrair_ano(raw, url)
              return limpar_titulo_bruto("", url), extrair_ano("", url)

          def fazer_slug(titulo, url=""):
              t = unicodedata.normalize("NFKD", str(titulo or ""))
              t = "".join(c for c in t if not unicodedata.combining(c))
              s = re.sub(r"[^a-z0-9]", "_", t.lower())
              s = re.sub(r"_+", "_", s).strip("_")
              if not s:
                  m = re.search(r"/([^/?#]+?)(?:\.html)?(?:[?#].*)?$", url or "")
                  s = re.sub(r"[^a-z0-9]+", "_", (m.group(1) if m else "").lower()).strip("_")
              return s or "sem_titulo"

          def is_icon_url(url):
              if not url: return True
              u = str(url).lower()
              if "placeholder" in u or "placehold.co" in u or "sem+capa" in u: return True
              caminho = urlparse(u).path
              if re.search(r"(?:^|[/_.\-])(?:favicon|icon|logo|avatar)s?(?:[/_.\-0-9]|$)", caminho): return True
              if re.search(r"\.(?:ico|svg)$", caminho): return True
              if re.search(r"[=/]s(?:16|24|32|48|64|72|96)(?:-[a-z]+)?(?:[/?]|$)", u): return True
              return False

          def normalizar_url(u):
              u = (u or "").strip()
              if u.startswith("//"): u = "https:" + u
              if u.startswith("http://"): u = "https://" + u[7:]
              return u

          def capa_valida(u):
              u = normalizar_url(u)
              return len(u) >= 10 and u.startswith("https://") and not is_icon_url(u)

          def corpo_post(soup):
              return soup.select_one(".post-body, .entry-content, article") or soup

          def escolher_capa(soup, html_text=""):
              candidatas = []
              for ld in ler_ld(soup):
                  candidatas += como_lista(ld.get("thumbnailUrl"))
                  candidatas += como_lista(ld.get("image"))
              for prop in ("og:image", "twitter:image"):
                  m = soup.find("meta", property=prop) or soup.find("meta", attrs={"name": prop})
                  if m and m.get("content"): candidatas.append(m["content"])
              for img in corpo_post(soup).find_all("img"):
                  for attr in ("src", "data-src"):
                      if img.get(attr): candidatas.append(img[attr])
              candidatas += re.findall(r"https://blogger\.googleusercontent\.com/img/[^\"'\s<>]+", html_text or "")
              for c in candidatas:
                  c = normalizar_url(c)
                  if capa_valida(c): return c
              return PLACEHOLDER

          def extrair_link_estatico(html_text, soup=None):
              soup = soup or BeautifulSoup(html_text, "html.parser")
              for ld in ler_ld(soup):
                  v = ld.get("contentUrl")
                  if isinstance(v, str) and v.startswith("http"): return v
              m = re.findall(r"(https?://[^\"'\s<>]+(?:\.mp4|\.m3u8|tankie\.tube/videos/embed|oneplayer\.site)[^\"'\s<>]*)", html_text)
              if m: return m[0]
              for tag in soup.find_all(["video", "source"]):
                  src = tag.get("src") or ""
                  if src.startswith("http"): return src
              return None

          _TEMPLATE = """<!DOCTYPE html>
          <html lang="pt-BR">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <script type="application/ld+json">
          __JSON__
          </script>
          <title>__TITULO__</title>
          <style>
          body, html { margin: 0; padding: 0; background-color: #000; height: 100%; width: 100%; overflow: hidden; }
          video { width: 100%; height: 100%; outline: none; background: #000; }
          </style>
          </head>
          <body>
          <video id="v" __MARCADOR__ controls playsinline preload="none" poster="__CAPA__"></video>
          <script>
          (function () {
            var v = document.getElementById("v");
            var u = atob("__B64__");
            var iniciado = false;
            function iniciar() {
              if (iniciado) { return; }
              iniciado = true;
              v.src = u;
              v.load();
              var p = v.play();
              if (p && p.catch) { p.catch(function () {}); }
            }
            v.addEventListener("click", iniciar);
            v.addEventListener("touchend", iniciar);
            v.addEventListener("play", iniciar);
          })();
          </script>
          </body>
          </html>
          """

          def montar_html(arquivo, nome_json, link, capa):
              file_url = f"{PAGES_URL}/{arquivo}"
              dados = {
                  "@context": "https://schema.org", "@type": "VideoObject",
                  "@id": file_url, "url": file_url,
                  "name": nome_json, "description": f"Assista {nome_json}",
                  "thumbnailUrl": [capa],
                  "uploadDate": "2020-01-01T00:00:00+00:00", "inLanguage": "pt",
                  "contentUrl": link, "embedUrl": link,
              }
              js = json.dumps(dados, ensure_ascii=False, indent=4).replace("</", "<\\/")
              b64 = base64.b64encode(link.encode("utf-8")).decode("ascii")
              return (_TEMPLATE.replace("__JSON__", js).replace("__TITULO__", htmllib.escape(nome_json))
                      .replace("__MARCADOR__", MARCADOR_FORMATO).replace("__CAPA__", htmllib.escape(capa, quote=True)).replace("__B64__", b64))

          def salvar_html(destino, nome_json, link, capa):
              Path(destino).write_text(montar_html(Path(destino).name, nome_json, link, capa), encoding="utf-8")

          INDICE = {}
          LINK_DO_ARQ = {}

          def construir_indice():
              INDICE.clear()
              LINK_DO_ARQ.clear()
              duplicados = 0
              for f in sorted(Path(".").glob("*.html")):
                  try: texto = f.read_text(encoding="utf-8")
                  except Exception: continue
                  m = re.search(r'"contentUrl":\s*"([^"]+)"', texto)
                  if not m: continue
                  link = m.group(1)
                  if link in INDICE: duplicados += 1
                  INDICE[link] = f
                  LINK_DO_ARQ[f] = link
              log(f"Índice: {len(LINK_DO_ARQ)} arquivos mapeados" + (f" ({duplicados} com vídeo duplicado)" if duplicados else ""))

          def registrar(path, link):
              path = Path(path)
              antigo = LINK_DO_ARQ.get(path)
              if antigo and INDICE.get(antigo) == path: del INDICE[antigo]
              INDICE[link] = path
              LINK_DO_ARQ[path] = link

          def nome_ok(nome_atual, stem):
              if nome_atual == stem + ".html": return True
              return nome_atual.startswith(stem + "_") and bool(re.fullmatch(r"\d{1,2}\.html", nome_atual[len(stem) + 1:]))

          # CORREÇÃO CRÍTICA: Nunca gerar _2, _3. Episódios têm apenas um arquivo.
          def escolher_nome(stem, link):
              return f"{stem}.html"

          def buscar_por_stem(stem):
              for p in LINK_DO_ARQ:
                  if nome_ok(p.name, stem) and p.exists(): return p
              return None

          def checar_defeitos(arquivo):
              d = {"n": True, "c": True, "f": True, "nome": "", "capa": ""}
              try: conteudo = Path(arquivo).read_text(encoding="utf-8")
              except Exception: return d
              d["f"] = MARCADOR_FORMATO not in conteudo
              try:
                  soup = BeautifulSoup(conteudo, "html.parser")
                  ld = next(ler_ld(soup), None)
              except Exception: ld = None
              if not ld: return d
              nome = str(ld.get("name") or "")
              capas = como_lista(ld.get("thumbnailUrl"))
              capa = capas[0] if capas else ""
              d["nome"], d["capa"] = nome, capa
              d["n"] = bool(len(nome.strip()) < 3 or re.search(r"https?:|\.html?\b|\bNone\b", nome) or _PREFIXO.match(nome) or nome.count(SUFIXO) != 1 or re.search(r"\((\d{4})\)\s*\(\1\)", nome))
              d["c"] = (not capa) or capa == "h" or is_icon_url(capa)
              return d

          def upsert(stem, nome_json, link, capa, modo, ind="    "):
              existente = INDICE.get(link) if link else None
              if existente is not None and not existente.exists(): existente = None
              if not link:
                  existente = buscar_por_stem(stem)
                  if existente is None: return "sem_link"
                  link = LINK_DO_ARQ[existente]

              if existente is not None:
                  d = checar_defeitos(existente)
                  renomear = not nome_ok(existente.name, stem)
                  log(f"{ind}(Arquivo existente: {existente.name})")
                  if modo == "apenas_baixar": return "ignorado"
                  if not (renomear or d["n"] or d["c"] or d["f"]):
                      log(f"{ind}(Já está perfeito).")
                      return "perfeito"
                  capa_final = capa if capa_valida(capa) else (d["capa"] if capa_valida(d["capa"]) else capa)
                  nome_final = nome_json if (renomear or d["n"] or not d["nome"]) else d["nome"]
                  destino = Path(escolher_nome(stem, link)) if renomear else existente
                  salvar_html(destino, nome_final, link, capa_final)
                  if destino != existente:
                      existente.unlink()
                      LINK_DO_ARQ.pop(existente, None)
                  registrar(destino, link)
                  log(f"{ind}[🔄] Arquivo atualizado.")
                  return "corrigido"

              destino = Path(escolher_nome(stem, link))
              if destino.exists():
                  if modo == "apenas_baixar": return "ignorado"
                  salvar_html(destino, nome_json, link, capa)
                  registrar(destino, link)
                  return "corrigido"
              if modo == "apenas_consertar": return "pulado"
              salvar_html(destino, nome_json, link, capa)
              registrar(destino, link)
              log(f"{ind}[+] Salvo: {destino.name}")
              return "novo"

          def registrar_erro(erros, url, arq_descartados, maximo=3):
              erros[url] = erros.get(url, 0) + 1
              if erros[url] >= maximo:
                  anexar_linha(arq_descartados, url)
                  erros.pop(url, None)
                  return True
              return False

          def escrever_faltam(n):
              try: FALTAM_ARQ.write_text(str(int(n)), encoding="utf-8")
              except Exception: pass

          from playwright.async_api import async_playwright

          ARQ_FILA        = Path("series_fila.txt")
          ARQ_FEITAS      = Path("series_feitas.txt")
          ARQ_CONSERTADAS = Path("series_consertadas.txt")
          ARQ_PENDENTES   = Path("episodios_pendentes.json")
          ARQ_DESCARTADOS = Path("series_descartados.txt")
          ARQ_ERROS       = Path("series_erros.json")
          ARQ_PROGRESSO = ARQ_CONSERTADAS if MODO == "apenas_consertar" else ARQ_FEITAS

          def marcar(url):
              anexar_linha(ARQ_PROGRESSO, url)
              if MODO == "baixar_e_consertar": anexar_linha(ARQ_CONSERTADAS, url)

          def eh_serie(soup):
              for ld in ler_ld(soup):
                  tipos = ld.get("@type")
                  tipos = tipos if isinstance(tipos, list) else [tipos]
                  if any(t in ("TVSeries", "TVSeason", "TVEpisode") for t in tipos): return True
              for a in soup.find_all("a", href=True):
                  if re.search(r"epis[oó]dio[-_/]\d+", a["href"], re.I): return True
                  if re.search(r"\bepis[oó]dio\s+\d+", a.get_text(strip=True), re.I): return True
              texto = soup.get_text(" ", strip=True).lower()
              if re.search(r"lista de epis[oó]dios", texto): return True
              if re.search(r"\b\d+\s*[ªº°]\s*temporada", texto): return True
              return False

          def temporada_inicial(titulo_bruto, url):
              for texto in (titulo_bruto or "", (url or "").replace("-", " ").replace("_", " ")):
                  m = re.search(r"(\d+)\s*[ªº°]?\s*(?:a\s+)?temporada", texto, re.I)
                  if m: return int(m.group(1))
              return 1

          def extrair_episodios(soup, temp_inicial=1):
              temporada, eps, vistos = temp_inicial, [], set()
              for tag in soup.find_all(["b", "strong", "h2", "h3", "h4", "p", "span", "div", "a"]):
                  texto = tag.get_text(strip=True)
                  if tag.name != "a":
                      # CORREÇÃO BADLANDS: regex rigorosa e sem limite de 40 chars para evitar pegar lixo.
                      m = re.match(r"^(\d+)\s*[ªº°]?\s*Temporada$", texto, re.I) or re.match(r"^Temporada\s*(\d+)$", texto, re.I)
                      if m:
                          temporada = int(m.group(1))
                      continue
                  if not re.search(r"epis[oó]dio", texto, re.I): continue
                  href = tag.get("href")
                  if not href: continue
                  href = urljoin(BASE_URL + "/", href)
                  if href in vistos: continue
                  vistos.add(href)
                  m_ep = re.search(r"Epis[oó]dio\s*(\d+)", texto, re.I)
                  num = m_ep.group(1) if m_ep else str(sum(1 for e in eps if e["temp"] == temporada) + 1)
                  titulo_ep = re.sub(r"Epis[oó]dio\s*\d+\s*[-–:]?\s*", "", texto, flags=re.I).strip()
                  eps.append({"temp": temporada, "ep": num, "titulo": titulo_ep, "url": href})
              return eps

          async def obter_link_episodio(ctx, url_ep):
              status, texto = await asyncio.to_thread(http_get, url_ep)
              if status == 200 and validar_html(texto, url_ep):
                  link = extrair_link_estatico(texto)
                  if link: return link
              html = await renderizar(ctx, url_ep)
              if html and validar_html(html, url_ep):
                  return extrair_link_estatico(html)
              return None

          def nome_episodio(titulo, temp, ep, titulo_ep):
              nome = f"{titulo} - T{temp}E{ep}"
              if titulo_ep: nome += f" - {titulo_ep}"
              return f"{nome} - {SUFIXO}"

          async def processar_serie(ctx, url_serie, pendentes):
              log(f"\n--> Verificando série: {url_serie}")
              status, texto = await asyncio.to_thread(http_get, url_serie)
              if status == 429: return "rate_limit"
              if status is None: return "erro_rede"
              if status in (404, 410): return "descartar"
              if status != 200: return "erro_rede"
              if not validar_html(texto, url_serie): return "erro_rede"

              soup = BeautifulSoup(texto, "html.parser")
              if not eh_serie(soup):
                  sem_pistas = not re.search(r"epis[oó]dio|temporada", texto, re.I)
                  if extrair_link_estatico(texto, soup) and sem_pistas: return "filme"
                  html_r = await renderizar(ctx, url_serie)
                  if not html_r or not validar_html(html_r, url_serie): return "filme"
                  soup_r = BeautifulSoup(html_r, "html.parser")
                  if not eh_serie(soup_r): return "filme"
                  soup, texto = soup_r, html_r

              titulo, _ = escolher_titulo(soup, url_serie)
              brutos = candidatos_titulo(soup)
              capa = escolher_capa(soup, texto)
              slug = fazer_slug(titulo, url_serie)
              eps = extrair_episodios(soup, temporada_inicial(brutos[0] if brutos else "", url_serie))

              if not eps:
                  log("    (Nenhum episódio encontrado. Pulando...)")
                  return "ok"
              log(f"    Série '{titulo}' ({slug}) - {len(eps)} eps.")

              for it in eps:
                  stem = f"{slug}_t{it['temp']}e{it['ep']}"
                  nome_json = nome_episodio(titulo, it["temp"], it["ep"], it["titulo"])
                  try:
                      link = await obter_link_episodio(ctx, it["url"])
                      res = upsert(stem, nome_json, link, capa, MODO, ind="      ")
                  except Exception as e:
                      log(f"      Erro no T{it['temp']}E{it['ep']}: {e}")
                      continue
                  if res == "sem_link" and MODO != "apenas_consertar":
                      log(f"      Sem link para T{it['temp']}E{it['ep']} (vai para retentativa).")
                      if not any(p["arquivo"] == stem + ".html" for p in pendentes):
                          pendentes.append({"arquivo": stem + ".html", "stem": stem, "nome_json": nome_json,
                                            "url": it["url"], "capa": capa, "tentativas": 1})
                  # Pausa entre episódios para evitar 429
                  espera = DELAY_ENTRE + random.uniform(0, DELAY_JITTER)
                  await asyncio.sleep(espera)
              return "ok"

          async def main():
              # Sincroniza Filas (Reclassificação)
              f_file = Path("filmes_fila.txt")
              s_file = Path("series_fila.txt")
              f_urls = set(f_file.read_text(encoding="utf-8").splitlines()) if f_file.exists() else set()
              s_urls = set(s_file.read_text(encoding="utf-8").splitlines()) if s_file.exists() else set()
              incertos = f_urls & s_urls
              f_file.write_text("\n".join(sorted(f_urls | incertos)) + ("\n" if f_urls else ""), encoding="utf-8")
              s_file.write_text("\n".join(sorted(s_urls | incertos)) + ("\n" if s_urls else ""), encoding="utf-8")
              log(f"Filas sincronizadas. Incertos em ambas: {len(incertos)}")

              construir_indice()
              if not ARQ_FILA.exists():
                  urls, _ = buscar_urls_feed()
                  if urls: escrever_linhas(ARQ_FILA, urls)

              todas = ler_linhas(ARQ_FILA)
              feitas = set(ler_linhas(ARQ_PROGRESSO))
              fila = [u for u in todas if u not in feitas]
              lote = fila[:LOTE_SIZE]
              log(f"Fila: {len(todas)} | Faltam: {len(fila)} | Lote: {LOTE_SIZE} | Modo: {MODO}")

              pendentes = carregar_pendentes(ARQ_PENDENTES)
              anteriores = list(pendentes) if MODO != "apenas_consertar" else []
              erros = carregar_json(ARQ_ERROS, {})
              erros_desta_run, site_fora = [], False

              async with async_playwright() as pw:
                  browser = await pw.chromium.launch(headless=True)
                  ctx = await browser.new_context(user_agent=HEADERS["User-Agent"])
                  seguidos_sem_rede = 0

                  for i, url in enumerate(lote, 1):
                      if i > 1:
                          espera = DELAY_ENTRE + random.uniform(0, DELAY_JITTER)
                          log(f"\n    ⏳ aguardando {espera:.1f}s entre séries...")
                          await asyncio.sleep(espera)

                      log(f"[{i}/{len(lote)}]")
                      try: status = await processar_serie(ctx, url, pendentes)
                      except Exception as e: status = "erro"

                      if status == "rate_limit":
                          log("    ⏸️ rate-limit: pausa extra de 60s.")
                          await asyncio.sleep(60 + random.uniform(0, 15))
                          continue
                      if status in ("erro_rede", "erro"):
                          erros_desta_run.append(url)
                          seguidos_sem_rede = seguidos_sem_rede + 1 if status == "erro_rede" else 0
                          if seguidos_sem_rede >= 8:
                              site_fora = True
                              break
                          continue
                      seguidos_sem_rede = 0
                      marcar(url)
                      if status == "descartar": anexar_linha(ARQ_DESCARTADOS, url)

                  if not site_fora:
                      for url in erros_desta_run:
                          if registrar_erro(erros, url, ARQ_DESCARTADOS):
                              marcar(url)

                  if anteriores and not site_fora:
                      log(f"\n=== RETENTANDO {len(anteriores)} EPISÓDIOS SEM LINK ===")
                      for item in anteriores:
                          espera = DELAY_ENTRE + random.uniform(0, DELAY_JITTER)
                          await asyncio.sleep(espera)
                          try: link = await obter_link_episodio(ctx, item["url"])
                          except Exception: continue
                          if link:
                              stem = item.get("stem") or item["arquivo"][:-5]
                              upsert(stem, item["nome_json"], link, item.get("capa") or PLACEHOLDER, MODO, ind="    ")
                              pendentes[:] = [p for p in pendentes if p["arquivo"] != item["arquivo"]]
                              log("    [+] SUCESSO")
                          else:
                              item["tentativas"] = item.get("tentativas", 1) + 1
                              if item["tentativas"] >= MAX_TENTATIVAS:
                                  anexar_linha(ARQ_DESCARTADOS, item["url"])
                                  pendentes[:] = [p for p in pendentes if p["arquivo"] != item["arquivo"]]
                  await browser.close()

              salvar_json(ARQ_PENDENTES, pendentes)
              salvar_json(ARQ_ERROS, erros)
              feitas = set(ler_linhas(ARQ_PROGRESSO))
              faltam = 0 if site_fora else len([u for u in ler_linhas(ARQ_FILA) if u not in feitas])
              escrever_faltam(faltam)
              log(f"\nFim da run. Faltam {faltam} séries. Pendentes: {len(pendentes)}. Erros 429 totais: {METRICAS_429}")

          if __name__ == "__main__":
              asyncio.run(main())
          PYEOF
          python3 /tmp/mega_series.py

      - name: Salvar arquivos e progresso
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "feat: extracao de series corrigida"
          ok=0
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then ok=1; break; fi
            git pull origin main --no-rebase -X ours --no-edit
            git add -A
            git reset .github/ 2>/dev/null || true
            git commit -m "feat: retry $i" || true
            sleep $((RANDOM % 10 + 5))
          done
          if [ "$ok" != "1" ]; then echo "::error::Falha no push"; exit 1; fi

      - name: Disparar próxima run (se fila não vazia)
        if: |
          success() && (
            github.event_name == 'schedule' ||
            inputs.auto_run == true ||
            inputs.auto_run == 'true'
          )
        env:
          GH_TOKEN: ${{ secrets.PAT_CHAIN }}
          REPO: ${{ github.repository }}
          LOTE_IN: ${{ inputs.lote || '100' }}
          MODO_IN: ${{ inputs.modo || 'baixar_e_consertar' }}
          DELAY_IN: ${{ inputs.delay_entre_seg || '30' }}
          RETRY429_IN: ${{ inputs.retry_429_seg || '60' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "PAT_CHAIN não configurado."; exit 0; fi
          FALTAM=$(cat /tmp/faltam.txt 2>/dev/null || echo 0)
          echo "Faltam: $FALTAM"
          if [ "${FALTAM:-0}" -le 0 ]; then exit 0; fi

          LIMITE_ISO=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          RECENTES=$(gh run list --workflow="Series.yml" --event workflow_dispatch --limit 100 \
            --json createdAt --jq "[.[] | select(.createdAt > \"$LIMITE_ISO\")] | length" \
            --repo "$REPO" 2>/dev/null || echo 0)
          if [ "${RECENTES:-0}" -ge 60 ]; then echo "Limite por hora atingido."; exit 0; fi

          sleep 30
          gh workflow run "Series.yml" --repo "$REPO" --ref main \
            -f auto_run=true -f lote="$LOTE_IN" -f reprocessar_tudo=false \
            -f modo="$MODO_IN" -f delay_entre_seg="$DELAY_IN" -f retry_429_seg="$RETRY429_IN"
