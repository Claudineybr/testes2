name: Mega Extrair Series (Lotes de 100)

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:
    inputs:
      lote:
        description: 'URLs para visitar por run'
        required: false
        default: '100'
        type: string
      reprocessar_tudo:
        description: 'Limpar fila e começar do zero?'
        required: false
        default: false
        type: boolean
      modo:
        description: 'O que o robô deve fazer?'
        required: true
        default: 'baixar_e_consertar'
        type: choice
        options:
          - baixar_e_consertar
          - apenas_consertar
          - apenas_baixar
      auto_run:
        description: 'Ativar auto-chain?'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: mega-series
  cancel-in-progress: false

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Limpar arquivos de controle (Opcional)
        if: ${{ inputs.reprocessar_tudo == true || inputs.reprocessar_tudo == 'true' }}
        run: |
          rm -f series_fila.txt series_feitas.txt episodios_pendentes.json series_descartados.txt

      - name: Instalar Python e Playwright
        run: |
          pip install playwright beautifulsoup4 requests
          playwright install chromium
          playwright install-deps

      - name: Extrair Series e Retentar Falhas
        env:
          LOTE_SIZE: ${{ inputs.lote || '100' }}
          MODO_EXECUCAO: ${{ inputs.modo || 'baixar_e_consertar' }}
        run: |
          cat > /tmp/mega_series.py << 'PYEOF'
          import asyncio, re, json, requests, sys, unicodedata, os, html
          from collections import Counter
          from bs4 import BeautifulSoup
          from pathlib import Path
          from playwright.async_api import async_playwright

          BASE_URL = "https://www.vini7xgrave.site"
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}

          ARQ_FILA        = Path("series_fila.txt")
          ARQ_FEITAS      = Path("series_feitas.txt")
          ARQ_PENDENTES   = Path("episodios_pendentes.json")
          ARQ_DESCARTADOS = Path("series_descartados.txt")
          ARQ_REPROCESSAR = Path("reprocessar_series.txt")

          MAX_TENTATIVAS = 6
          LOTE_SIZE = int(os.environ.get('LOTE_SIZE', 100))
          MODO = os.environ.get('MODO_EXECUCAO', 'baixar_e_consertar').lower()

          def log(*a):
              print(*a, flush=True); sys.stdout.flush()

          def remover_surrogates(texto):
              if not texto: return texto
              return ''.join(c for c in texto if not (0xD800 <= ord(c) <= 0xDFFF))

          def decodificar_escapes_unicode(texto):
              if not texto or '\\u' not in texto: return texto
              try:
                  return json.loads('"' + texto.replace('"', '\\"') + '"')
              except Exception: pass
              def _repl(m):
                  code = int(m.group(1), 16)
                  if 0xD800 <= code <= 0xDFFF: return ''
                  return chr(code)
              return re.sub(r'\\u([0-9a-fA-F]{4})', _repl, texto)

          def parece_sujo(titulo):
              t = (titulo or '').strip().lower()
              prefixos = r'(?:vini7x|vini|marcos|inix|grave|clau|site|rave|filmes\s*e\s*s[eé]ries)'
              return bool(re.match(r'^[^\w]*' + prefixos + r'(?:[^a-z]|$)', t))

          def limpar_titulo_bruto(titulo, url):
              if not titulo: titulo = ""
              if "http" in str(titulo).lower() or str(titulo).lower().endswith(".html"): titulo = ""

              titulo = html.unescape(str(titulo))
              titulo = decodificar_escapes_unicode(titulo)
              titulo = unicodedata.normalize('NFKD', titulo)
              titulo = "".join([c for c in titulo if not unicodedata.combining(c)])

              padrao_prefixo_curto = r'(?:Marcøsx7|Marcos|Vini7x|ViNi7x|inix|arc|entre_nos)'
              titulo = re.sub(rf'^{padrao_prefixo_curto}\b[^a-zA-Z0-9]*[-:]\s*', '', titulo, flags=re.I).strip()

              if ':' in titulo:
                  prefixo, resto = titulo.split(':', 1)
                  if re.search(r'\b(?:vini7x|vini|marcos|inix|grave|clau|site|rave|filmes\s*e\s*s[eé]ries)\b', prefixo, re.I):
                      titulo = resto.strip()

              if ' - ' in titulo:
                  prefixo, resto = titulo.split(' - ', 1)
                  if re.search(r'\b(?:vini7x|vini|marcos|inix|grave|clau|site|rave)\b', prefixo, re.I):
                      titulo = resto.strip()

              if ' - ' in titulo:
                  prefixo, resto = titulo.rsplit(' - ', 1)
                  if re.search(r'\b(?:vini7x|vini|marcos|inix|grave|clau|site|rave)\b', resto, re.I):
                      titulo = prefixo.strip()

              titulo = re.sub(r'\s*[-–—]\s*(?:assistir|online|serie|completo|dublado|legendado|hd|temporada).*$', '', titulo, flags=re.I).strip()
              titulo = titulo.replace('🍿Clau', '').strip(' -–—')
              titulo = re.sub(r'\s*\(?\d{4}\)?\s*$', '', titulo).strip(' -–—')
              titulo = re.sub(r'\s*-\s*(?:\d+\s*[ªº]\s*)?(?:temporada|season)\b.*$', '', titulo, flags=re.I).strip()
              titulo = re.sub(r'\s+', ' ', titulo).strip(' -–—')

              if len(titulo) < 3:
                  m = re.search(r'/([^/]+)\.html', url)
                  if m:
                      slug = m.group(1)
                      slug = re.sub(r'^(?:inix|arc|entre-nos|vini|marcos)[-_]', '', slug, flags=re.I)
                      slug = re.sub(r'[-_]\d{4}.*$', '', slug)
                      titulo = slug.replace('-', ' ').replace('_', ' ').title()

              return remover_surrogates(titulo)

          def is_icon_url(url):
              if not url: return True
              url_lower = url.lower()
              lixos = ['icon', 'logo', 'favicon', 'avatar', 'banner', 'default', 'profile']
              return any(x in url_lower for x in lixos)

          def extrair_titulos_fontes(soup, html_text):
              fontes = {}
              h1 = soup.find('h1', class_='post-title') or soup.find('h1')
              if h1 and h1.text.strip(): fontes['h1'] = h1.text.strip()
              if soup.title and soup.title.string: fontes['title_tag'] = soup.title.string
              for prop, key in [('og:title', 'og_title'), ('og:description', 'og_desc')]:
                  tag = soup.find('meta', property=prop)
                  if tag and tag.get('content'): fontes[key] = tag['content']
              for name, key in [('twitter:title', 'tw_title'), ('description', 'meta_desc')]:
                  tag = soup.find('meta', attrs={'name': name})
                  if tag and tag.get('content'): fontes[key] = tag['content']
              bm = soup.find(attrs={'data-bm-title': True})
              if bm: fontes['bm_title'] = bm['data-bm-title']
              for script in soup.find_all('script', type='application/ld+json'):
                  try:
                      d = json.loads(script.string)
                      if isinstance(d, dict):
                          if d.get('headline'): fontes['ld_headline'] = d['headline']
                          if d.get('name') and d.get('@type') in ('VideoObject', 'TVSeries', 'TVEpisode', 'TVSeason'):
                              fontes['ld_video'] = d['name']
                  except Exception: pass
              json_data = soup.find('script', id='json:data')
              if json_data:
                  try:
                      d = json.loads(json_data.string)
                      bg = d.get('bg', {}); vw = d.get('vw', {})
                      if bg.get('pgNm'): fontes['pgNm'] = bg['pgNm']
                      if bg.get('pgTtl'): fontes['pgTtl'] = bg['pgTtl']
                      if vw.get('ttl'): fontes['vw_ttl'] = vw['ttl']
                  except Exception: pass
              json_posts = soup.find('script', id='json:blogposts')
              if json_posts:
                  try:
                      d = json.loads(json_posts.string)
                      for _, v in d.items():
                          if isinstance(v, dict) and v.get('ttl'):
                              fontes['blogposts_ttl'] = v['ttl']; break
                  except Exception: pass
              sh = soup.find('div', class_='shPt')
              if sh and sh.get('data-text'): fontes['share'] = sh['data-text']
              m = re.search(r"'pageName':\s*'([^']+)'", html_text)
              if m: fontes['pageName'] = m.group(1)
              return fontes

          def votar_titulos(fontes, url):
              if not fontes: return limpar_titulo_bruto("", url)
              limpos = {}
              for nome, valor in fontes.items():
                  if not valor or str(valor).strip() == 'h' or len(str(valor).strip()) < 2: continue
                  limpo = limpar_titulo_bruto(str(valor), url)
                  if limpo and len(limpo) >= 2: limpos[nome] = limpo
              if not limpos: return limpar_titulo_bruto("", url)
              limpos_bons = {k: v for k, v in limpos.items() if not parece_sujo(v)}
              if limpos_bons: limpos = limpos_bons
              contagem = Counter(); original = {}
              for nome, valor in limpos.items():
                  chave = valor.lower().strip()
                  contagem[chave] += 1
                  if chave not in original: original[chave] = valor
              mais_votado, votos = contagem.most_common(1)[0]
              titulo_final = original[mais_votado]
              total = len(limpos)
              if votos < total:
                  log(f"    [🗳️] Votação: {votos}/{total} -> '{titulo_final}'")
                  for chave, cnt in contagem.items():
                      if chave != mais_votado:
                          log(f"        ⚠️  Divergência ({cnt}x): '{original[chave]}'")
              else:
                  log(f"    [🗳️] Consenso total ({votos}/{total}): '{titulo_final}'")
              return remover_surrogates(titulo_final)

          def construir_indice_videos():
              log("Mapeando arquivos existentes...")
              indice = {}
              for f in Path(".").glob("*.html"):
                  try:
                      texto = f.read_text(encoding="utf-8")
                      m = re.search(r'"contentUrl":\s*"([^"]+)"', texto)
                      if m: indice[m.group(1)] = f
                  except: pass
              return indice

          INDICE_VIDEOS = construir_indice_videos()

          def construir_fila():
              log("Criando/atualizando fila de series...")
              urls, vistos = [], set()
              if ARQ_FILA.exists():
                  for u in ARQ_FILA.read_text(encoding="utf-8").splitlines():
                      u = u.strip()
                      if u and u not in vistos: urls.append(u); vistos.add(u)
              start = 1
              while True:
                  url_feed = f"{BASE_URL}/feeds/posts/default?alt=json&max-results=150&start-index={start}"
                  try:
                      r = requests.get(url_feed, headers=HEADERS, timeout=15)
                      if r.status_code != 200: break
                      entries = r.json().get("feed", {}).get("entry", [])
                      if not entries: break
                      for e in entries:
                          link = next((l["href"] for l in e.get("link", []) if l.get("rel") == "alternate"), None)
                          if link:
                              u = link.split("?")[0].strip()
                              if u and u not in vistos: urls.append(u); vistos.add(u)
                      start += 150
                      if len(entries) < 150: break
                  except: break
              ARQ_FILA.write_text("\n".join(urls), encoding="utf-8")

          if not ARQ_FILA.exists(): construir_fila()

          feitas = set()
          if ARQ_FEITAS.exists():
              feitas = set(l.strip() for l in ARQ_FEITAS.read_text(encoding="utf-8").splitlines() if l.strip())

          pendentes_dict = {}
          if ARQ_PENDENTES.exists():
              try:
                  for p in json.loads(ARQ_PENDENTES.read_text(encoding="utf-8")):
                      if p['arquivo'] not in pendentes_dict: pendentes_dict[p['arquivo']] = p
                      else: pendentes_dict[p['arquivo']]['tentativas'] = max(pendentes_dict[p['arquivo']].get('tentativas',1), p.get('tentativas',1))
              except: pass
          pendentes = list(pendentes_dict.values())

          reprocessar_urls = []
          if ARQ_REPROCESSAR.exists():
              for linha in ARQ_REPROCESSAR.read_text(encoding="utf-8").splitlines():
                  u = linha.strip()
                  if u and not u.startswith("#"): reprocessar_urls.append(u)
          if reprocessar_urls:
              log(f"Reprocessar_series.txt: {len(reprocessar_urls)} URL(s) forçada(s)")
              for u in reprocessar_urls:
                  if u in feitas:
                      feitas.discard(u)
                      log(f"    [🔁] Retirada de 'feitas': {u}")
              ARQ_REPROCESSAR.write_text("", encoding="utf-8")

          todas = [u.strip() for u in ARQ_FILA.read_text(encoding="utf-8").splitlines() if u.strip()]
          fila_normal = [u for u in todas if u not in feitas and u not in reprocessar_urls]
          fila = reprocessar_urls + fila_normal
          lote = fila[:LOTE_SIZE]

          log(f"Fila: {len(todas)} | Faltam: {len(fila_normal)} | Lote: {LOTE_SIZE} | Modo: {MODO}")

          def eh_serie(soup, url_pagina):
              for script in soup.find_all('script', type='application/ld+json'):
                  try:
                      dados = json.loads(script.string)
                      if isinstance(dados, list):
                          for d in dados:
                              if d.get('@type') in ['TVSeries','TVSeason','TVEpisode']: return True
                      elif isinstance(dados, dict):
                          if dados.get('@type') in ['TVSeries','TVSeason','TVEpisode']: return True
                  except: pass
              for a in soup.find_all('a', href=True):
                  if re.search(r'epis[oó]dio[-_/]\d+', a['href'], re.I): return True
                  if re.search(r'\bepis[oó]dio\s+\d+', a.get_text(strip=True), re.I): return True
              texto_pagina = soup.get_text(" ", strip=True).lower()
              if re.search(r'lista de epis[oó]dios', texto_pagina, re.I): return True
              if re.search(r'\b\d+\s*[ªº]\s*temporada', texto_pagina, re.I): return True
              return False

          def extrair_dados_pagina(html_text, url_pagina):
              soup = BeautifulSoup(html_text, 'html.parser')
              if not eh_serie(soup, url_pagina): return None, None, None, "FILME"

              fontes = extrair_titulos_fontes(soup, html_text)
              titulo = votar_titulos(fontes, url_pagina)

              capa = ""
              script_ld = soup.find('script', type='application/ld+json')
              if script_ld:
                  try: capa = json.loads(script_ld.string).get('thumbnailUrl', [''])[0]
                  except: pass
              if not capa or capa == 'h' or len(capa) < 5 or is_icon_url(capa):
                  m = re.search(r'https://blogger\.googleusercontent\.com/img/[^"\'\s<>]+', html_text)
                  if m and not is_icon_url(m.group(0)): capa = m.group(0)
                  else:
                      og_img = soup.find('meta', property='og:image')
                      if og_img and og_img.get('content') and not is_icon_url(og_img['content']):
                          capa = og_img['content']
                      else:
                          capa = "https://via.placeholder.com/500x750?text=Sem+Capa"

              duracao = "PT00H45M00S"
              if script_ld:
                  try:
                      dados_ld = json.loads(script_ld.string)
                      if dados_ld.get('duration'): duracao = dados_ld['duration']
                  except: pass

              return titulo.strip(), capa, duracao

          def extrair_video_da_pagina(html_text):
              soup = BeautifulSoup(html_text, 'html.parser')
              script_ld = soup.find('script', type='application/ld+json')
              if script_ld:
                  try:
                      dados_ld = json.loads(script_ld.string)
                      if dados_ld.get('contentUrl'): return dados_ld['contentUrl']
                  except: pass
              matches = re.findall(r'(https?://[^"\'\s<>]+(?:\.mp4|\.m3u8|tankie\.tube/videos/embed|oneplayer\.site)[^"\'\s<>]*)', html_text)
              if matches: return matches[0]
              return None

          async def obter_link_episodio(context, url_ep):
              try:
                  r_ep = await asyncio.to_thread(requests.get, url_ep, headers=HEADERS, timeout=20)
                  link = extrair_video_da_pagina(r_ep.text)
                  if link: return link
              except Exception: pass
              try:
                  page = await context.new_page()
                  await page.goto(url_ep, wait_until="domcontentloaded", timeout=20000)
                  await asyncio.sleep(5)
                  html_r = await page.content()
                  link = extrair_video_da_pagina(html_r)
                  await page.close()
                  if link: return link
              except Exception: pass
              return None

          def salvar_html(caminho_destino, nome_json, link, capa_url, duracao="PT00H45M00S"):
              nome_json = remover_surrogates(nome_json)
              capa_url = remover_surrogates(capa_url) if capa_url else capa_url

              base_url = "https://api-pobreflix-filmes.pages.dev"
              file_url = f"{base_url}/{caminho_destino.name}"
              dados = {
                  "@context": "https://schema.org",
                  "@type": "VideoObject",
                  "@id": file_url,
                  "url": file_url,
                  "name": nome_json,
                  "description": f"Assista {nome_json}",
                  "thumbnailUrl": [capa_url],
                  "uploadDate": "2020-01-01T00:00:00+00:00",
                  "inLanguage": "pt",
                  "contentUrl": link,
                  "embedUrl": link,
                  "supportPlatform": ["https://schema.org/IOSPlatform", "https://schema.org/AndroidPlatform"],
                  "duration": duracao,
                  "interactionStatistic": {
                      "@type": "InteractionCounter",
                      "interactionType": {"@type": "WatchAction"},
                      "userInteractionCount": 9458
                  }
              }
              js = json.dumps(dados, ensure_ascii=False, indent=4)
              title_attr = html.escape(nome_json, quote=True)
              html_out = (
                  f'<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n'
                  f'<meta charset="UTF-8">\n'
                  f'<meta name="viewport" content="width=device-width, initial-scale=1.0">\n'
                  f'<link rel="icon" href="data:,">\n'
                  f'<script type="application/ld+json">\n{js}\n</script>\n'
                  f'<title>{nome_json}</title>\n'
                  f'<style>\nbody, html {{ margin: 0; padding: 0; background-color: #000; height: 100%; width: 100%; overflow: hidden; }}\n'
                  f'video {{ width: 100%; height: 100%; outline: none; }}\n</style>\n</head>\n<body>\n'
                  f'<video id="player-video" title="{title_attr}" poster="{capa_url}" src="{link}" controls autoplay playsinline></video>\n'
                  f'</body>\n</html>'
              )
              caminho_destino.write_text(html_out, encoding='utf-8', errors='replace')

          def checar_defeitos(arquivo):
              try:
                  conteudo = arquivo.read_text(encoding="utf-8")
                  soup = BeautifulSoup(conteudo, 'html.parser')
                  script = soup.find('script', type='application/ld+json')
                  if not script: return True, True, "", ""
                  dados = json.loads(script.string)
                  nome = dados.get('name', '')
                  capa = dados.get('thumbnailUrl', [''])[0] if dados.get('thumbnailUrl') else ''
                  nome_norm = unicodedata.normalize('NFKD', nome)
                  nome_norm = "".join([c for c in nome_norm if not unicodedata.combining(c)])
                  has_surrogates = any(0xD800 <= ord(c) <= 0xDFFF for c in nome)
                  n_quebrado = (
                      len(nome_norm) < 3 or
                      bool(re.match(r'^(?:[^\w]*)(?:vini7x|vini|marcos|inix|grave|clau|site|rave)\b', nome_norm, re.I)) or
                      "http" in nome_norm.lower() or
                      has_surrogates
                  )
                  c_quebrada = ("placeholder" in capa or "Sem+Capa" in capa or not capa or is_icon_url(capa))
                  return n_quebrado, c_quebrada, nome, capa
              except: return True, True, "", ""

          async def processar_serie(context, url_serie):
              log(f"\n--> Verificando serie: {url_serie}")
              try:
                  r = await asyncio.to_thread(requests.get, url_serie, headers=HEADERS, timeout=20)
                  soup = BeautifulSoup(r.text, 'html.parser')
                  html_final = r.text

                  if not eh_serie(soup, url_serie):
                      async with async_playwright() as pw:
                          browser = await pw.chromium.launch(headless=True)
                          page = await browser.new_page()
                          await page.goto(url_serie, wait_until="domcontentloaded", timeout=20000)
                          await asyncio.sleep(5)
                          html_render = await page.content()
                          soup_render = BeautifulSoup(html_render, 'html.parser')
                          if not eh_serie(soup_render, url_serie):
                              log("    (É FILME. Pulando...)")
                              with open(ARQ_FEITAS,"a",encoding="utf-8") as f: f.write(url_serie.strip()+"\n")
                              await browser.close(); return
                          html_final = html_render; soup = soup_render
                          await browser.close()

                  titulo, capa_url, duracao = extrair_dados_pagina(html_final, url_serie)
                  slug = re.sub(r'[^a-z0-9]', '_', titulo.lower())
                  slug = re.sub(r'_+', '_', slug).strip('_')

                  temporada, eps = 1, []
                  vistos_eps = set()
                  for tag in soup.find_all(['b', 'h2', 'h3', 'p', 'a', 'div']):
                      texto = tag.get_text(strip=True)
                      m_temp = re.search(r'(\d+)\s*[ªº]\s*Temporada', texto, re.I)
                      if m_temp:
                          temporada = int(m_temp.group(1)); continue
                      if tag.name == 'a' and 'episódio' in texto.lower():
                          href = tag.get('href')
                          if not href: continue
                          if href.startswith('/'): href = BASE_URL + href
                          m_ep = re.search(r'Episódio\s*(\d+)', texto, re.I)
                          num = m_ep.group(1) if m_ep else "0"
                          chave_ep = (temporada, num)
                          if chave_ep in vistos_eps: continue
                          vistos_eps.add(chave_ep)
                          titulo_ep_bruto = re.sub(r'Episódio\s*\d+\s*-?\s*', '', texto, flags=re.I).strip()
                          titulo_ep = limpar_titulo_bruto(titulo_ep_bruto, href)
                          eps.append({'temp': temporada, 'ep': num, 'titulo': titulo_ep, 'url': href})

                  with open(ARQ_FEITAS,"a",encoding="utf-8") as f: f.write(url_serie.strip()+"\n")
                  if not eps:
                      log("    (Nenhum episódio encontrado. Pulando...)"); return
                  log(f"    Série '{titulo}' ({slug}) - {len(eps)} eps.")

                  for it in eps:
                      nome_arquivo_calculado = f"{slug}_t{it['temp']}e{it['ep']}.html"
                      nome_json = remover_surrogates(f"{titulo} - T{it['temp']}E{it['ep']} - {it['titulo']} - 🍿Clau")

                      link = await obter_link_episodio(context, it['url'])
                      arquivo_existente = INDICE_VIDEOS.get(link) if link else None

                      if arquivo_existente:
                          n_quebrado, c_quebrada, nome_antigo, capa_antiga = checar_defeitos(arquivo_existente)
                          renomear = (arquivo_existente.name != nome_arquivo_calculado)
                          if MODO == 'apenas_baixar':
                              log(f"      (Arquivo existente: {arquivo_existente.name}). Modo Apenas Baixar: Ignorando.")
                              continue
                          if not renomear and not n_quebrado and not c_quebrada:
                              log(f"      (Arquivo existente: {arquivo_existente.name}). (Já está perfeito).")
                              continue
                          log(f"      (Arquivo existente: {arquivo_existente.name})")
                          acoes = []
                          if renomear: acoes.append(f"Renomeado ({arquivo_existente.name} → {nome_arquivo_calculado})")
                          if n_quebrado: acoes.append(f"Título corrigido")
                          if c_quebrada: acoes.append("Capa corrigida")
                          log(f"      [🔄] {', '.join(acoes)}...")

                          novo_caminho = Path(nome_arquivo_calculado) if renomear else arquivo_existente
                          salvar_html(novo_caminho, nome_json, link, capa_url, duracao)
                          if renomear and arquivo_existente.exists():
                              arquivo_existente.unlink()
                              log(f"      [+] Salvo como: {novo_caminho.name}")
                          else:
                              log(f"      [+] Arquivo atualizado in-place.")
                          continue

                      arquivo_por_nome = Path(nome_arquivo_calculado)
                      if arquivo_por_nome.exists():
                          n_quebrado, c_quebrada, _, _ = checar_defeitos(arquivo_por_nome)
                          if MODO == 'apenas_baixar': continue
                          if n_quebrado or c_quebrada:
                              acoes = []
                              if n_quebrado: acoes.append("Título corrigido")
                              if c_quebrada: acoes.append("Capa corrigida")
                              log(f"      (Arquivo existe pelo nome: {nome_arquivo_calculado})")
                              log(f"      [🔄] {', '.join(acoes)}...")
                              salvar_html(arquivo_por_nome, nome_json, link or extrair_video_da_pagina(r.text), capa_url, duracao)
                              log(f"      [+] Arquivo atualizado.")
                          else:
                              log(f"      (Arquivo existe pelo nome: {nome_arquivo_calculado}). (Já está perfeito).")
                          continue

                      if MODO == 'apenas_consertar':
                          log(f"      (Não existe e modo é Apenas Consertar. Pulando.)")
                          continue

                      log(f"      -> Processando novo T{it['temp']}E{it['ep']}")
                      if not link:
                          if not any(p['arquivo']==nome_arquivo_calculado for p in pendentes):
                              pendentes.append({"arquivo": nome_arquivo_calculado, "nome_json": nome_json, "url": it['url'], "tentativas": 1})
                          continue
                      salvar_html(Path(nome_arquivo_calculado), nome_json, link, capa_url, duracao)
                      log(f"      [+] Salvo: {nome_arquivo_calculado}")
              except Exception as e:
                  log(f"    Erro na serie {url_serie}: {e}")

          async def main():
              async with async_playwright() as pw:
                  browser = await pw.chromium.launch(headless=True)
                  ctx = await browser.new_context(user_agent=HEADERS["User-Agent"])
                  for i, url in enumerate(lote, 1):
                      log(f"[{i}/{len(lote)}]")
                      await processar_serie(ctx, url)
                  if pendentes:
                      log(f"\n=== RETENTANDO {len(pendentes)} EPISODIOS ===")
                      ainda = []
                      for item in pendentes:
                          if Path(item['arquivo']).exists(): continue
                          if item.get("tentativas",0) >= MAX_TENTATIVAS: continue
                          log(f"--> Tentativa {item['tentativas']+1}/{MAX_TENTATIVAS}: {item['arquivo']}")
                          link = await obter_link_episodio(ctx, item['url'])
                          capa_ep = "https://via.placeholder.com/500x750?text=Sem+Capa"
                          try:
                              r_ep = await asyncio.to_thread(requests.get, item['url'], headers=HEADERS, timeout=20)
                              m_img = re.search(r'https://blogger\.googleusercontent\.com/img/[^"\'\s<>]+', r_ep.text)
                              if m_img and not is_icon_url(m_img.group(0)): capa_ep = m_img.group(0)
                          except: pass
                          if link:
                              salvar_html(Path(item['arquivo']), item['nome_json'], link, capa_ep)
                              log("    [+] SUCESSO")
                          else:
                              item["tentativas"] = item.get("tentativas",1) + 1
                              ainda.append(item)
                      pendentes.clear(); pendentes.extend(ainda)
                  await browser.close()

          if __name__ == "__main__":
              asyncio.run(main())
              try:
                  ARQ_PENDENTES.write_text(json.dumps(pendentes, ensure_ascii=False, indent=2), encoding="utf-8", errors="replace")
              except Exception as e:
                  log(f"Erro ao salvar pendentes: {e}")
          PYEOF
          python3 /tmp/mega_series.py

      - name: Salvar arquivos e progresso
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "feat: mega series (fix prefix arc + JSON-LD completo + reprocessar)"
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then break; fi
            git pull origin main --no-rebase -X ours --no-edit
            git add -A
            git reset .github/ 2>/dev/null || true
            git commit -m "feat: retry $i" || true
            sleep $((RANDOM % 10 + 5))
          done

      - name: Disparar próxima run (se fila não vazia)
        if: |
          success() && (
            github.event_name == 'schedule' || 
            inputs.auto_run == true || 
            inputs.auto_run == 'true'
          )
        env:
          GH_TOKEN: ${{ secrets.PAT_CHAIN }}
          REPO: ${{ github.repository }}
        run: |
          TOTAL=$(wc -l < series_fila.txt)
          FEITOS=$(sort -u series_feitas.txt | wc -l)
          FALTAM=$((TOTAL - FEITOS))
          echo "Faltam: $FALTAM"
          if [ "$FALTAM" -le 0 ]; then exit 0; fi
          RECENTES=$(gh run list --workflow="series.yml" --limit 100 --json event,createdAt --jq "[.[] | select(.event == \"workflow_dispatch\")] | length" --repo "$REPO" 2>/dev/null || echo 0)
          if [ "$RECENTES" -ge 100 ]; then exit 0; fi
          sleep 30
          gh workflow run "series.yml" --repo "$REPO" --ref main -f auto_run=true -f lote="${{ inputs.lote || '100' }}" -f reprocessar_tudo=false -f modo="${{ inputs.modo || 'baixar_e_consertar' }}"
