          def montar_html(arquivo, nome_json, link, capa):
              nome_json = tirar_lixo_do_site(nome_json)
              file_url = f"{PAGES_URL}/{arquivo}"
              dados = {
                  "@context": "https://schema.org", "@type": "VideoObject",
                  "@id": file_url, "url": file_url,
                  "name": nome_json, "description": f"Assista {nome_json}",
                  "thumbnailUrl": [capa],
                  "uploadDate": "2020-01-01T00:00:00+00:00", "inLanguage": "pt",
                  "contentUrl": link, "embedUrl": link,
              }
              js = json.dumps(dados, ensure_ascii=False, indent=4).replace("</", "<\\/")
              b64 = base64.b64encode(link.encode("utf-8")).decode("ascii")
              return (_TEMPLATE
                      .replace("__JSON__", js)
                      .replace("__TITULO__", htmllib.escape(nome_json))
                      .replace("__MARCADOR__", MARCADOR_FORMATO)
                      .replace("__CAPA__", htmllib.escape(capa, quote=True))
                      .replace("__B64__", b64))


          def reparar_link(link):
              """Conserta links com defeito simples ('ttps://', 'https:https://', '//host', host sem https).
              Devolve o link corrigido, ou None se não for uma URL aproveitável (texto solto, '!', link cortado)."""
              if not isinstance(link, str):
                  return None
              l = link.strip().strip("\"'")
              l = re.sub(r"^https?:(?=https?://)", "", l, flags=re.I)
              l = re.sub(r"^h?ttp(s?)://", lambda m: "http" + m.group(1) + "://", l, flags=re.I)
              if l.startswith("//"):
                  l = "https:" + l
              elif not re.match(r"https?://", l, re.I) and re.match(r"[a-z0-9-]+(?:\.[a-z0-9-]+)+/", l, re.I):
                  l = "https://" + l
              if re.fullmatch(r"https?://[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+(?::\d+)?(?:[/?#].*)?", l):
                  return l
              return None


          def salvar_html(destino, nome_json, link, capa):
              destino = Path(destino)
              link = reparar_link(link) or link
              if not link or not str(link).startswith("http"):
                  raise ValueError(f"link inválido para {destino.name}: {link!r}")
              escrever_atomico(destino, montar_html(destino.name, nome_json, link, capa))


          INDICE = {}
          LINK_DO_ARQ = {}


          def construir_indice():
              INDICE.clear()
              LINK_DO_ARQ.clear()
              duplicados = 0
              for f in sorted(Path(".").glob("*.html")):
                  try:
                      texto = f.read_text(encoding="utf-8")
                  except Exception:
                      continue
                  m = re.search(r'"contentUrl":\s*"([^"]+)"', texto)
                  if not m:
                      continue
                  link = m.group(1)
                  fix = reparar_link(link)
                  if fix is None:
                      continue   # link impossível de aproveitar: o robô refaz o arquivo quando achar o post
                  link = fix
                  if link in INDICE:
                      duplicados += 1
                  INDICE[link] = f
                  LINK_DO_ARQ[f] = link
              log(f"Índice: {len(LINK_DO_ARQ)} arquivos mapeados"
                  + (f" ({duplicados} com vídeo duplicado)" if duplicados else ""))


          def registrar(path, link):
              path = Path(path)
              antigo = LINK_DO_ARQ.get(path)
              if antigo and INDICE.get(antigo) == path:
                  del INDICE[antigo]
              INDICE[link] = path
              LINK_DO_ARQ[path] = link


          def nome_ok(nome_atual, stem):
              if nome_atual == stem + ".html":
                  return True
              return nome_atual.startswith(stem + "_") and bool(
                  re.fullmatch(r"\d{1,2}\.html", nome_atual[len(stem) + 1:]))


          def nome_fora_do_padrao(nome):
              """True se o nome do arquivo tem lixo depois do ano (gênero, legendado, hdcam...)."""
              base = re.sub(r"\.html?$", "", str(nome or ""), flags=re.I)
              if re.search(r"_(?:19|20)\d{2}_(?!\d{1,2}$)[a-z]", base):
                  return True
              return bool(re.search(r"(?:^|_)(?:legendado|hdcam|hdts|webrip)(?:_|$)", base))


          _EP_STEM = re.compile(r"^(.*)_t(\d+)e(?:p)?(\d+)$")
          _EP_ARQ = re.compile(r"_t(\d+)e(?:p)?(\d+)(?:_\d+)?\.html$")


          def chave_ep_stem(stem):
              m = _EP_STEM.match(stem or "")
              return (int(m.group(2)), int(m.group(3))) if m else None


          def chave_ep_arquivo(nome):
              m = _EP_ARQ.search(nome or "")
              return (int(m.group(1)), int(m.group(2))) if m else None


          def titulo_do_episodio(nome):
              n = str(nome or "").replace(SUFIXO, "")
              m = re.search(r"T\d+E\d+\s*[-–—]\s*(.*?)\s*[-–—]?\s*$", n)
              t = unicodedata.normalize("NFKD", m.group(1) if m else "")
              t = "".join(c for c in t if not unicodedata.combining(c))
              return re.sub(r"[^a-z0-9]+", " ", t.lower()).strip()


          def escolher_nome(stem, link):
              if chave_ep_stem(stem) is not None:
                  return f"{stem}.html"
              i = 1
              while True:
                  nome = f"{stem}.html" if i == 1 else f"{stem}_{i}.html"
                  p = Path(nome)
                  if not p.exists():
                      return nome
                  dono = LINK_DO_ARQ.get(p)
                  if dono is None or dono == link:
                      return nome
                  i += 1


          def buscar_por_stem(stem):
              for p in LINK_DO_ARQ:
                  if nome_ok(p.name, stem) and p.exists():
                      return p
              return None


          def checar_defeitos(arquivo):
              d = {"n": True, "c": True, "f": True, "l": True, "nome": "", "capa": "", "link": None}
              try:
                  conteudo = Path(arquivo).read_text(encoding="utf-8")
              except Exception:
                  return d
              d["f"] = MARCADOR_FORMATO not in conteudo or not re.search(r"</html\s*>", conteudo[-300:], re.I)
              try:
                  soup = BeautifulSoup(conteudo, "html.parser")
                  ld = next(ler_ld(soup), None)
              except Exception:
                  ld = None
              if not ld:
                  return d
              nome = str(ld.get("name") or "")
              capas = como_lista(ld.get("thumbnailUrl"))
              capa = capas[0] if capas else ""
              link = ld.get("contentUrl")
              d["nome"], d["capa"] = nome, capa
              d["link"] = link if isinstance(link, str) and link.startswith("http") else None
              d["l"] = d["link"] is None or reparar_link(link) != link
              d["n"] = bool(
                  len(nome.strip()) < 3
                  or re.search(r"https?:|\.html?\b|\bNone\b", nome)
                  or "\U0001F47E" in nome
                  or re.search(r"vini\s*7x", nome, re.I)
                  or _PREFIXO.match(nome)
                  or nome.count(SUFIXO) != 1
                  or re.search(r"\((\d{4})\)\s*\(\1\)", nome))
              d["c"] = (not capa) or capa == "h" or is_icon_url(capa)
              return d


          def _resolver_slot(ocupante, nome_json):
              d = checar_defeitos(ocupante)
              if d["l"]:
                  return "sobrescrever", d
              t_old, t_new = titulo_do_episodio(d["nome"]), titulo_do_episodio(nome_json)
              if t_old and t_new and t_old == t_new:
                  return "sobrescrever", d
              return "descartar", d


          def _conflito(tipo, stem, link, nome_json, ocupante, d, ind):
              METRICAS["conflitos"] += 1
              log(f"{ind}[⚠️] CONFLITO ({tipo}) em {stem}: já existe '{ocupante.name}' com outro vídeo. Nada foi alterado.")
              evento(tipo, "", arquivo=stem + ".html", ocupante=ocupante.name, nome_ocupante=d.get("nome", ""),
                     nome_novo=nome_json, link_ocupante=d.get("link"), link_novo=link)
              return "conflito"


          def upsert(stem, nome_json, link, capa, modo, ind="    "):
              if link:
                  link = reparar_link(link)   # None => tratado como "sem link" (nunca grava link quebrado)
              ep = chave_ep_stem(stem) is not None
              existente = INDICE.get(link) if link else None
              if existente is not None and not existente.exists():
                  existente = None
              if not link:
                  existente = buscar_por_stem(stem)
                  if existente is None:
                      return "sem_link"
                  link = LINK_DO_ARQ[existente]

              if existente is not None:
                  d = checar_defeitos(existente)
                  # Filmes: só renomeia se o nome atual estiver FORA do padrão (gênero, 'legendado'...).
                  # Se vários posts usam o mesmo vídeo, o arquivo NÃO fica trocando de nome a cada run.
                  renomear = not nome_ok(existente.name, stem) and (ep or nome_fora_do_padrao(existente.name))
                  log(f"{ind}(Arquivo existente: {existente.name})")
                  if modo == "apenas_baixar":
                      log(f"{ind}Modo Apenas Baixar: ignorando conserto.")
                      return "ignorado"
                  if ep and renomear:
                      antigo, novo = chave_ep_arquivo(existente.name), chave_ep_stem(stem)
                      if antigo and novo and antigo != novo:
                          METRICAS["conflitos"] += 1
                          log(f"{ind}[⚠️] REMAPEAMENTO BLOQUEADO: {existente.name} -> {stem}.html (T/E diferente).")
                          evento("remapeamento_bloqueado", "", arquivo=existente.name, novo=stem + ".html", link=link)
                          return "conflito"
                  destino = existente
                  if renomear:
                      destino = Path(escolher_nome(stem, link))
                      if ep and destino.exists() and destino != existente:
                          dono = LINK_DO_ARQ.get(destino)
                          if dono is not None and dono != link:
                              decisao, dd = _resolver_slot(destino, nome_json)
                              if decisao == "descartar":
                                  return _conflito("slot_ocupado", stem, link, nome_json, destino, dd, ind)
                  if not (renomear or d["n"] or d["c"] or d["f"] or d["l"]):
                      log(f"{ind}(Já está perfeito).")
                      return "perfeito"
                  acoes = []
                  if renomear: acoes.append("Renomeado")
                  if d["n"]: acoes.append("Título corrigido")
                  if d["c"]: acoes.append("Capa corrigida")
                  if d["f"]: acoes.append("Formato atualizado")
                  if d["l"]: acoes.append("Link refeito")
                  log(f"{ind}[🔄] {', '.join(acoes)}...")
                  capa_final = capa if capa_valida(capa) else (d["capa"] if capa_valida(d["capa"]) else capa)
                  nome_final = nome_json if (renomear or d["n"] or not d["nome"]) else d["nome"]
                  salvar_html(destino, nome_final, link, capa_final)
                  if destino != existente:
                      existente.unlink()
                      LINK_DO_ARQ.pop(existente, None)
                      log(f"{ind}[+] Salvo como: {destino.name}")
                  else:
                      log(f"{ind}[+] Arquivo atualizado in-place.")
                  registrar(destino, link)
                  return "corrigido"

              destino = Path(escolher_nome(stem, link))
              if destino.exists():
                  dono = LINK_DO_ARQ.get(destino)
                  if ep and dono is not None and dono != link:
                      decisao, dd = _resolver_slot(destino, nome_json)
                      if decisao == "descartar":
                          return _conflito("slot_ocupado", stem, link, nome_json, destino, dd, ind)
                      log(f"{ind}[🔄] Mesmo episódio com link novo: atualizando {destino.name}")
                  else:
                      log(f"{ind}[🔄] Refazendo arquivo quebrado: {destino.name}")
                  if modo == "apenas_baixar":
                      log(f"{ind}Modo Apenas Baixar: ignorando.")
                      return "ignorado"
                  salvar_html(destino, nome_json, link, capa)
                  registrar(destino, link)
                  return "corrigido"
              if modo == "apenas_consertar":
                  log(f"{ind}(Não existe e o modo é Apenas Consertar. Pulando.)")
                  return "pulado"
              salvar_html(destino, nome_json, link, capa)
              registrar(destino, link)
              log(f"{ind}[+] Salvo: {destino.name}")
              return "novo"


          MAX_EVENTOS = 500


          def carregar_erros(arq):
              d = carregar_json(arq, {})
              if not isinstance(d, dict):
                  d = {}
              if "contagem" not in d and "eventos" not in d:
                  d = {"contagem": {k: v for k, v in d.items() if isinstance(v, int)}}
              d.setdefault("contagem", {})
              d.setdefault("eventos", [])
              d.setdefault("metricas", {})
              return d


          def salvar_erros(arq, erros, robo):
              erros["eventos"] = (erros.get("eventos", []) + EVENTOS)[-MAX_EVENTOS:]
              ultima = dict(METRICAS, robo=robo, quando=agora_iso(), duracao_min=round((time.time() - T0) / 60, 1))
              acum = erros["metricas"].get("acumulado", {})
              for k, v in METRICAS.items():
                  acum[k] = acum.get(k, 0) + v
              erros["metricas"] = {"ultima_run": ultima, "acumulado": acum}
              salvar_json(arq, erros)
              log("\n📊 MÉTRICAS DESTA RUN (" + robo + "): " + " | ".join(f"{k}={v}" for k, v in METRICAS.items()))
              por_tipo = {}
              for e in EVENTOS:
                  por_tipo[e["tipo"]] = por_tipo.get(e["tipo"], 0) + 1
              if por_tipo:
                  log("📋 EVENTOS: " + " | ".join(f"{k}={v}" for k, v in sorted(por_tipo.items())))


          def registrar_erro(erros, url, arq_descartados, maximo=3):
              c = erros.setdefault("contagem", {})
              c[url] = c.get(url, 0) + 1
              if c[url] >= maximo:
                  anexar_linha(arq_descartados, url)
                  c.pop(url, None)
                  evento("url_descartada", url, motivo=f"{maximo} falhas seguidas")
                  return True
              return False


          def escrever_faltam(n):
              try:
                  FALTAM_ARQ.write_text(str(int(n)), encoding="utf-8")
              except Exception as e:
                  log(f"(não consegui gravar {FALTAM_ARQ}: {e})")


          from playwright.async_api import async_playwright

          ARQ_FILA        = Path("filmes_fila.txt")
          ARQ_FEITAS      = Path("filmes_feitos.txt")
          ARQ_CONSERTADOS = Path("filmes_consertados.txt")
          ARQ_PENDENTES   = Path("filmes_pendentes.json")
          ARQ_DESCARTADOS = Path("filmes_descartados.txt")
          ARQ_ERROS       = Path("filmes_erros.json")

          FEED_POSTS = {}
          ARQ_PROGRESSO = ARQ_CONSERTADOS if MODO == "apenas_consertar" else ARQ_FEITAS


          def marcar(url):
              anexar_linha(ARQ_PROGRESSO, url)
              if MODO == "baixar_e_consertar":
                  anexar_linha(ARQ_CONSERTADOS, url)


          def eh_serie_estrito(soup):
              for ld in ler_ld(soup):
                  tipos = ld.get("@type")
                  tipos = tipos if isinstance(tipos, list) else [tipos]
                  if any(t in ("TVSeries", "TVSeason", "TVEpisode") for t in tipos):
                      return True
              for a in soup.find_all("a", href=True):
                  if re.search(r"epis[oó]dio[-_/]\d+", a["href"], re.I):
                      return True
                  if re.search(r"\bepis[oó]dio\s+\d+", a.get_text(strip=True), re.I):
                      return True
              return False


          def stem_pela_url(url):
              titulo = _titulo_pela_url(url)
              ano = ano_da_url(url)
              slug = fazer_slug(titulo, url)
              if ano and not re.search(r"\d{4}", titulo):
                  return f"{slug}_{ano}"
              return slug


          _GENERICO_LINK = re.compile(
              r"^(?:filme|parte|part|vol(?:ume)?|cd|link|op[çc][ãa]o|player|assistir|download|baixar|clique aqui|"
              r"video|vídeo|fonte|source|aqui|filmes)?\s*\d*$", re.I)


          def base_da_saga(titulo):
              """'Saga Tinker Bell' / 'Tinker Bell - Coleção' -> 'Tinker Bell' (para o nome dos arquivos)."""
              t = re.sub(r"\b(?:saga|cole[çc][ãa]o|colet[âa]nea|quadrilogia|duologia|trilogia|box|franquia|completa?)\b",
                         " ", str(titulo or ""), flags=re.I)
              t = re.sub(r"\s+", " ", t).strip(" -–—|:")
              return t if len(t) >= 3 else str(titulo or "").strip()


          def titulo_do_embed(link):
              """Player do tankie.tube: o <title> da página traz o nome certo do filme
              ('ViNi7x - Homem-Formiga e a Vespa: Quantumania [ 2023 ] ‧ Ação/Aventura - TankieTube').
              Devolve (titulo_limpo, ano) ou ("", ""). Outro site que não o Blogger: não usa a fila global de 429."""
              if not re.match(r"https?://(?:www\.)?tankie\.tube/", str(link or "")):
                  return "", ""
              for tentativa in range(2):
                  try:
                      r = requests.get(link, headers=HEADERS, timeout=20)
                      if r.status_code == 200:
                          m = re.search(r"<title[^>]*>(.*?)</title>", r.text, re.I | re.S)
                          if not m:
                              return "", ""
                          bruto = html_lib.unescape(m.group(1)).strip()
                          bruto = re.sub(r"\s*[-–—|]\s*Tankie\s*Tube\s*$", "", bruto, flags=re.I)
                          titulo = limpar_titulo_bruto(bruto, "", fallback=False)
                          return (titulo, extrair_ano(bruto, "")) if len(titulo) >= 3 else ("", "")
                  except Exception:
                      pass
                  time.sleep(3)
              return "", ""


          def _salvar_multifilme(stem_base, titulo_base, ano_base, links, capa, pendentes, url=""):
              METRICAS["multifilme_paginas"] += 1
              base = base_da_saga(titulo_base)
              slug_base = fazer_slug(base, "")
              log(f"    (SAGA: página com {len(links)} vídeos)")
              nomes = []

              for idx, item in enumerate(links):
                  link_unico = item["link"]
                  texto = item["texto"].strip()

                  # 1) nome certo do filme, lido do próprio player; 2) texto do link, se for um título de verdade;
                  # 3) título do post + número sequencial (tinker_bell_1, tinker_bell_2...)
                  if idx:
                      time.sleep(2)
                  tit, ano = titulo_do_embed(link_unico)
                  origem = "player"
                  if not tit and texto and not _GENERICO_LINK.match(texto):
                      tit = limpar_titulo_bruto(texto, "", fallback=False)
                      ano = extrair_ano(texto, "") if len(tit) >= 3 else ""
                      origem = "texto do link"
                  if len(tit) >= 3:
                      slug = fazer_slug(tit, "")
                      stem = f"{slug}_{ano}" if ano and not re.search(r"\d{4}", tit) else slug
                      nome_json = f"{tit} ({ano}) - {SUFIXO}" if ano else f"{tit} - {SUFIXO}"
                  else:
                      origem = "sequencial"
                      stem = f"{slug_base}_{idx + 1}"
                      nome_json = f"{base} {idx + 1} - {SUFIXO}"
                  nomes.append(f"{stem}.html [{origem}]")
                  log(f"      Vídeo {idx + 1}: {stem}.html (nome vindo de: {origem})")

                  res = upsert(stem, nome_json, link_unico, capa, MODO, ind="      ")
                  if res == "sem_link":
                      arq = f"{stem}.html"
                      log(f"      Sem link para {arq} (vai para retentativa).")
                      if not any(p["arquivo"] == arq for p in pendentes):
                          pendentes.append({"arquivo": arq, "stem": stem, "nome_json": nome_json,
                                            "url": link_unico, "capa": capa, "tentativas": 1})
                  elif res in ("novo", "corrigido"):
                      METRICAS["multifilme_arquivos"] += 1
              registrar_revisao(url, f"SAGA: {len(links)} vídeos no mesmo post -> " + ", ".join(nomes))


          async def processar_filme(ctx, url, pendentes=None):
              log(f"\n--> Verificando: {url}")
              if pendentes is None:
                  pendentes = []

              existente = buscar_por_stem(stem_pela_url(url))
              if existente:
                  d = checar_defeitos(existente)
                  if not (not nome_ok(existente.name, stem_pela_url(url)) or d["n"] or d["c"] or d["f"] or d["l"]):
                      log(f"    (Atalho) Já está perfeito: {existente.name}")
                      return "perfeito", None
                  log(f"    (Atalho) Existe '{existente.name}' mas tem defeito (n={d['n']} c={d['c']} f={d['f']} l={d['l']}), vou buscar de novo.")

              soup = link = None
              links_todos = []
              titulo_feed = ""
              ent = FEED_POSTS.get(url)
              if ent:
                  titulo_feed = (ent.get("titulo") or "").strip()
                  texto = pagina_do_feed(ent)
                  soup = BeautifulSoup(texto, "html.parser")
                  if eh_serie_estrito(soup):
                      log("    (É SÉRIE. Pulando...)")
                      return "serie", None

                  if _TITULO_MULTI.search(titulo_feed):
                      log(f"    (Título '{titulo_feed}' sugere coleção/saga — vou abrir a página para pegar TODOS)")
                      soup = link = None
                  else:
                      link = extrair_link_estatico(texto, soup)
                      if link and capa_valida(escolher_capa(soup, texto)):
                          soup_capa, html_capa = soup, texto
                          log("    (Dados do feed: sem requisição à página.)")
                      else:
                          log(f"    (Feed não trouxe {'link' if not link else 'capa válida'}; vou abrir a página.)")
                          soup = link = None

              if soup is None:
                  status, texto = await asyncio.to_thread(http_get_com_proxy, url, timeout=25)
                  if status == 429:
                      log(f"    [429] Direto + Proxmint esgotados; pulando para retentativa.")
                      return "rate_limit", None
                  if status is None:
                      log(f"    Falha de rede: {texto}")
                      return "erro_rede", None
                  if status in (404, 410):
                      log(f"    (Página não existe mais: HTTP {status}.)")
                      return "descartar", None
                  if status != 200:
                      log(f"    HTTP {status}. Tentaremos de novo depois.")
                      evento("http_status", url, status=status)
                      return "erro_rede", None
                  if not validar_html(texto, url):
                      return "erro_rede", None

                  soup = BeautifulSoup(texto, "html.parser")
                  if eh_serie_estrito(soup):
                      log("    (É SÉRIE. Pulando...)")
                      return "serie", None

                  links_todos = extrair_todos_links_video(texto, soup)
                  soup_capa, html_capa = soup, texto

                  if not links_todos:
                      METRICAS["playwright_skip"] += 1
                      log("    (Sem link nem em <a href>; vai para retentativa.)")
                      link = None
                  else:
                      link = links_todos[0]["link"]

              titulo, ano = escolher_titulo(soup, url)
              capa = escolher_capa(soup, texto)
              if not capa_valida(capa) and soup_capa is not soup:
                  capa = escolher_capa(soup_capa, html_capa)

              slug = fazer_slug(titulo, url)
              if ano and not re.search(r"\d{4}", titulo):
                  stem = f"{slug}_{ano}"
                  nome_json = f"{titulo} ({ano}) - {SUFIXO}"
              else:
                  stem = slug
                  nome_json = f"{titulo} - {SUFIXO}"

              if links_todos and len(links_todos) > 1:
                  _salvar_multifilme(stem, titulo, ano, links_todos, capa, pendentes, url)
                  return "novo", None

              log(f"    Título: '{titulo}' | ano: {ano or '-'} | stem: {stem} | link: {'SIM' if link else 'NÃO'}")
              res = upsert(stem, nome_json, link, capa, MODO)
              if res == "sem_link":
                  log(f"    Filme '{nome_json}': vídeo não encontrado (vai para a fila de retentativa).")
                  return "sem_link", {"arquivo": stem + ".html", "nome_json": nome_json, "url": url, "capa": capa}
              return res, None


          async def pausa(motivo=""):
              espera = DELAY_ENTRE + random.uniform(0, DELAY_JITTER)
              log(f"\n    ⏳ aguardando {espera:.1f}s{motivo}...")
              await asyncio.sleep(espera)


          async def main():
              construir_indice()
              FEED_POSTS.update(indice_do_feed())

              log("\n⏳ Feed carregado. Aguardando 60s para esvaziar janela de rate limit...")
              time.sleep(60)
              log("✅ Cooldown concluído. Iniciando processamento de filmes.\n")

              if not ARQ_FILA.exists():
                  log("Criando fila de filmes...")
                  urls, _ = buscar_urls_feed()
                  if urls:
                      escrever_linhas(ARQ_FILA, urls)

              todas = ler_linhas(ARQ_FILA)
              feitas = set(ler_linhas(ARQ_PROGRESSO))
              fila = [u for u in todas if u not in feitas]
              lote = fila[:LOTE_SIZE]
              limite = f"{TEMPO_MAX_MIN} min" if TEMPO_MAX > 0 else "sem limite"
              log(f"Fila: {len(todas)} | Faltam: {len(fila)} | Lote: {LOTE_SIZE} | Modo: {MODO} | Tempo máx: {limite}")

              pendentes = carregar_pendentes(ARQ_PENDENTES)
              anteriores = list(pendentes) if MODO != "apenas_consertar" else []
              erros = carregar_erros(ARQ_ERROS)
              erros_desta_run, site_fora, bloqueado = [], False, False

              async with async_playwright() as pw:
                  browser = await pw.chromium.launch(headless=True)
                  ctx = await browser.new_context(user_agent=HEADERS["User-Agent"])
                  seguidos_sem_rede = seguidos_429 = 0
                  ultimo_fez_http = False

                  for i, url in enumerate(lote, 1):
                      if tempo_esgotado():
                          log("\n⏱️ Parada suave (antes do limite de 6h do GitHub): salvando o progresso.")
                          break
                      if i > 1 and ultimo_fez_http:
                          await pausa(" entre filmes")
                      elif i > 1:
                          METRICAS["pausas_evitadas"] += 1
                          log(f"[{i}/{len(lote)}] (pausa pulada — sem HTTP no item anterior)")
                      log(f"[{i}/{len(lote)}]" if ultimo_fez_http or i == 1 else f"")
                      try:
                          reqs_antes = METRICAS["requisicoes"]
                          status, info = await processar_filme(ctx, url, pendentes)
                          ultimo_fez_http = (METRICAS["requisicoes"] > reqs_antes)
                          if ultimo_fez_http:
                              METRICAS["http_realizados"] += 1
                      except Exception as e:
                          log(f"    Erro em {url}: {e}")
                          evento("excecao", url, detalhe=str(e)[:200])
                          status, info = "erro", None
                          ultimo_fez_http = False

                      if status == "rate_limit":
                          seguidos_429 += 1
                          evento("rate_limit", url, seguidos=seguidos_429)
                          if seguidos_429 >= 5:
                              log("\n🚫 5 URLs seguidas com 429: o site está bloqueando. Encerrando.")
                              bloqueado = True
                              break
                          log("    ⏸️ rate-limit: pausa extra.")
                          await asyncio.sleep(min(RETRY_TETO, RETRY_429_BASE * seguidos_429) + random.uniform(0, 15))
                          continue
                      seguidos_429 = 0
                      if status in ("erro_rede", "erro"):
                          erros_desta_run.append(url)
                          seguidos_sem_rede = seguidos_sem_rede + 1 if status == "erro_rede" else 0
                          if seguidos_sem_rede >= 8:
                              log("\n⚠️ 8 falhas de rede seguidas: o site parece fora do ar. Encerrando esta run.")
                              site_fora = True
                              break
                          continue
                      seguidos_sem_rede = 0

                      marcar(url)
                      if status == "descartar":
                          anexar_linha(ARQ_DESCARTADOS, url)
                      elif status == "sem_link" and MODO != "apenas_consertar":
                          if not any(p["arquivo"] == info["arquivo"] for p in pendentes):
                              pendentes.append({**info, "tentativas": 1})

                  if not (site_fora or bloqueado):
                      for url in erros_desta_run:
                          if registrar_erro(erros, url, ARQ_DESCARTADOS):
                              log(f"    (Descartado após várias falhas: {url})")
                              marcar(url)

                  if anteriores and not (site_fora or bloqueado) and not tempo_esgotado():
                      log(f"\n=== RETENTANDO {len(anteriores)} FILMES SEM LINK ===")
                      for item in anteriores:
                          if tempo_esgotado():
                              break
                          await pausa(" (retentativa)")
                          log(f"--> Tentativa {item.get('tentativas', 1) + 1}/{MAX_TENTATIVAS}: {item['arquivo']}")
                          try:
                              status, info = await processar_filme(ctx, item["url"], pendentes)
                          except Exception as e:
                              log(f"    Erro: {e}")
                              status, info = "erro", None
                          if status == "sem_link":
                              item["tentativas"] = item.get("tentativas", 1) + 1
                              if item["tentativas"] >= MAX_TENTATIVAS:
                                  log(f"    Desistindo de {item['arquivo']} após {MAX_TENTATIVAS} tentativas.")
                                  anexar_linha(ARQ_DESCARTADOS, item["url"])
                                  pendentes[:] = [p for p in pendentes if p["arquivo"] != item["arquivo"]]
                          elif status in ("erro", "erro_rede", "rate_limit"):
                              pass
                          else:
                              pendentes[:] = [p for p in pendentes if p["arquivo"] != item["arquivo"]]

                  await browser.close()

              salvar_json(ARQ_PENDENTES, pendentes)
              salvar_erros(ARQ_ERROS, erros, "filmes")

              feitas = set(ler_linhas(ARQ_PROGRESSO))
              faltam = 0 if (site_fora or bloqueado) else len([u for u in ler_linhas(ARQ_FILA) if u not in feitas])
              escrever_faltam(faltam)
              log(f"\nFim da run. Faltam {faltam} URLs. Pendentes de retentativa: {len(pendentes)}.")


          if __name__ == "__main__":
              asyncio.run(main())

          PYEOF
          python3 /tmp/mega_filmes.py

      - name: Salvar arquivos e progresso
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "feat: filmes (multifilme extraindo titulos dos <a>)"
          ok=0
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then ok=1; break; fi
            mkdir -p .git/info && echo "revisar.txt merge=union" >> .git/info/attributes
            git pull origin main --no-rebase -X ours --no-edit
            git add -A
            git reset .github/ 2>/dev/null || true
            git commit -m "feat: retry $i" || true
            sleep $((RANDOM % 10 + 5))
          done
          if [ "$ok" != "1" ]; then echo "::error::Não consegui dar push depois de 5 tentativas"; exit 1; fi

      - name: Disparar próxima run (se fila não vazia)
        if: |
          success() && (
            github.event_name == 'schedule' ||
            inputs.auto_run == true ||
            inputs.auto_run == 'true'
          )
        env:
          GH_TOKEN: ${{ secrets.PAT_CHAIN }}
          REPO: ${{ github.repository }}
          LOTE_IN: ${{ inputs.lote || '100' }}
          MODO_IN: ${{ inputs.modo || 'baixar_e_consertar' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "PAT_CHAIN não configurado: sem auto-chain."; exit 0; fi
          FALTAM=$(cat /tmp/faltam.txt 2>/dev/null || echo 0)
          echo "Faltam: $FALTAM"
          if [ "${FALTAM:-0}" -le 0 ]; then exit 0; fi

          LIMITE_ISO=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          RECENTES=$(gh run list --workflow="Filmes.yml" --event workflow_dispatch --limit 100 \
            --json createdAt --jq "[.[] | select(.createdAt > \"$LIMITE_ISO\")] | length" \
            --repo "$REPO" 2>/dev/null || echo 0)
          echo "Encadeamentos na última hora: $RECENTES"
          if [ "${RECENTES:-0}" -ge 60 ]; then echo "Limite por hora atingido."; exit 0; fi

          sleep 30
          gh workflow run "Filmes.yml" --repo "$REPO" --ref main \
            -f auto_run=true -f lote="$LOTE_IN" -f reprocessar_tudo=false \
            -f modo="$MODO_IN"
