name: Mega Extrair Filmes (Lotes de 100)

on:
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:
    inputs:
      lote:
        description: 'URLs para visitar por run'
        required: false
        default: '100'
        type: string
      reprocessar_tudo:
        description: 'Recomeçar do zero? (apaga só o progresso; a fila NUNCA é apagada)'
        required: false
        default: false
        type: boolean
      modo:
        description: 'O que o robô deve fazer?'
        required: true
        default: 'baixar_e_consertar'
        type: choice
        options:
          - baixar_e_consertar
          - apenas_consertar
          - apenas_baixar
      auto_run:
        description: 'Ativar auto-chain?'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: mega-filmes
  cancel-in-progress: false

jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Limpar arquivos de controle (Opcional)
        if: ${{ inputs.reprocessar_tudo == true || inputs.reprocessar_tudo == 'true' }}
        run: |
          rm -f filmes_feitos.txt filmes_consertados.txt filmes_pendentes.json filmes_descartados.txt filmes_erros.json

      - name: Instalar Python e Playwright
        run: |
          pip install playwright beautifulsoup4 requests proxmint
          playwright install --with-deps chromium

      - name: Extrair Filmes e Retentar Falhas
        env:
          LOTE_SIZE: ${{ inputs.lote || '100' }}
          MODO_EXECUCAO: ${{ inputs.modo || 'baixar_e_consertar' }}
          INTERVALO_MIN_SEG: '15'
          DELAY_ENTRE_SEG: '20'
          DELAY_JITTER_SEG: '5'
        run: |
          cat > /tmp/mega_filmes.py << 'PYEOF'
          import requests, sys, os, json, time, re, random, datetime, email.utils
          import html as html_lib
          from pathlib import Path
          from html import escape as _esc

          BASE_URL = "https://www.vini7xgrave.site"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "pt-BR,pt;q=0.9,en;q=0.8",
          }

          DELAY_ENTRE     = float(os.environ.get("DELAY_ENTRE_SEG") or 20)
          DELAY_JITTER    = float(os.environ.get("DELAY_JITTER_SEG") or 5)
          RETRY_429_BASE  = float(os.environ.get("RETRY_429_SEG") or 60)
          RETRY_TETO      = float(os.environ.get("RETRY_TETO_SEG") or 300)
          HTTP_TENTATIVAS = int(os.environ.get("HTTP_TENTATIVAS") or 4)
          INTERVALO_MIN   = float(os.environ.get("INTERVALO_MIN_SEG") or 15)

          PROXY_CACHE = []
          PROXY_CACHE_TIME = 0
          PROXY_CACHE_TTL = 300

          def obter_proxies():
              global PROXY_CACHE, PROXY_CACHE_TIME
              if PROXY_CACHE and (time.time() - PROXY_CACHE_TIME) < PROXY_CACHE_TTL:
                  return PROXY_CACHE
              try:
                  from proxmint import proxy_urls
                  PROXY_CACHE = proxy_urls(protocol="http", limit=20)
                  PROXY_CACHE_TIME = time.time()
                  log(f"🔄 Proxmint: {len(PROXY_CACHE)} proxies carregados.")
              except Exception as e:
                  log(f"⚠️ Proxmint indisponível: {str(e)[:100]}")
                  PROXY_CACHE = []
                  PROXY_CACHE_TIME = time.time()
              return PROXY_CACHE

          METRICAS = {"requisicoes": 0, "ok": 0, "429": 0, "5xx": 0, "retries": 0,
                      "falhas_definitivas": 0, "html_invalido": 0, "serie_inconsistente": 0,
                      "conflitos": 0, "proxy_fallback": 0, "proxy_hit": 0,
                      "pausas_evitadas": 0, "http_realizados": 0, "playwright_skip": 0,
                      "proxmint_listas": 0, "link_em_a_href": 0, "link_convertido_w2embed": 0,
                      "multifilme_paginas": 0, "multifilme_arquivos": 0}
          EVENTOS = []
          _estado = {"ultima": 0.0, "intervalo": INTERVALO_MIN}


          def log(*a):
              print(*a, flush=True)


          def agora_iso():
              return datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")


          def evento(tipo, url="", **campos):
              EVENTOS.append({"quando": agora_iso(), "tipo": tipo, "url": url, **campos})


          def ler_linhas(arq):
              arq = Path(arq)
              if not arq.exists():
                  return []
              vistos, saida = set(), []
              for linha in arq.read_text(encoding="utf-8").splitlines():
                  linha = linha.strip()
                  if linha and linha not in vistos:
                      vistos.add(linha)
                      saida.append(linha)
              return saida


          def escrever_linhas(arq, linhas):
              arq = Path(arq)
              tmp = arq.with_name(arq.name + ".tmp")
              tmp.write_text("\n".join(linhas) + ("\n" if linhas else ""), encoding="utf-8")
              tmp.replace(arq)


          def parse_retry_after(valor):
              if not valor:
                  return None
              valor = str(valor).strip()
              if valor.isdigit():
                  return float(valor)
              try:
                  dt = email.utils.parsedate_to_datetime(valor)
                  return max(0.0, (dt - datetime.datetime.now(dt.tzinfo)).total_seconds())
              except Exception:
                  return None


          def backoff(i, base):
              return min(RETRY_TETO, base * (2 ** i)) + random.uniform(0, min(8.0, base / 4 + 1))


          def _esperar_vez():
              falta = _estado["ultima"] + _estado["intervalo"] - time.time()
              if falta > 0:
                  time.sleep(falta)
              _estado["ultima"] = time.time()


          def http_get(url, timeout=25, tentativas=None):
              tentativas = tentativas or HTTP_TENTATIVAS
              ultimo, ultimo_status = "erro desconhecido", None
              for i in range(tentativas):
                  _esperar_vez()
                  METRICAS["requisicoes"] += 1
                  if i:
                      METRICAS["retries"] += 1
                  try:
                      r = requests.get(url, headers=HEADERS, timeout=timeout)
                  except Exception as e:
                      ultimo, ultimo_status = f"{type(e).__name__}: {str(e)[:120]}", None
                      if i < tentativas - 1:
                          time.sleep(min(RETRY_TETO, 6 * (i + 1)) + random.uniform(0, 3))
                      continue
                  st = r.status_code
                  if st == 429:
                      METRICAS["429"] += 1
                      _estado["intervalo"] = min(30.0, _estado["intervalo"] * 1.5 + 1)
                      ra = parse_retry_after(r.headers.get("Retry-After"))
                      espera = (min(ra, RETRY_TETO) + random.uniform(0, 3)) if ra is not None else backoff(i, RETRY_429_BASE)
                      ultimo, ultimo_status = "HTTP 429", 429
                      log(f"    429 (tentativa {i + 1}/{tentativas})"
                          + (f", Retry-After={ra:.0f}s" if ra is not None else "")
                          + (f": aguardando {espera:.0f}s..." if i < tentativas - 1 else ": desisti desta URL."))
                      if i < tentativas - 1:
                          time.sleep(espera)
                      continue
                  if st in (500, 502, 503, 504):
                      METRICAS["5xx"] += 1
                      ultimo, ultimo_status = f"HTTP {st}", st
                      if i < tentativas - 1:
                          time.sleep(min(RETRY_TETO, 15 * (i + 1)) + random.uniform(0, 5))
                      continue
                  _estado["intervalo"] = max(INTERVALO_MIN, _estado["intervalo"] * 0.9)
                  METRICAS["ok"] += 1
                  return st, r.text
              METRICAS["falhas_definitivas"] += 1
              evento("http_esgotado", url, status=ultimo_status, detalhe=ultimo, tentativas=tentativas)
              if ultimo_status == 429:
                  return 429, ""
              return None, ultimo


          def http_get_com_proxy(url, timeout=25):
              status, texto = http_get(url, timeout=timeout, tentativas=1)
              if status != 429:
                  return status, texto
              proxies = obter_proxies()
              if not proxies:
                  return 429, ""
              METRICAS["proxy_fallback"] += 1
              METRICAS["proxmint_listas"] += 1
              log(f"    [429] Direto bloqueado. Testando {len(proxies)} proxies do Proxmint...")
              for i, proxy in enumerate(proxies):
                  try:
                      _esperar_vez()
                      METRICAS["requisicoes"] += 1
                      t0 = time.time()
                      r = requests.get(url, headers=HEADERS, timeout=timeout,
                                       proxies={"http": proxy, "https": proxy})
                      dt = time.time() - t0
                      if r.status_code == 200 and len(r.text) > 2000:
                          METRICAS["ok"] += 1
                          METRICAS["proxy_hit"] += 1
                          log(f"    [PROXY {i+1}/{len(proxies)}] OK em {dt:.1f}s ({len(r.text)} bytes)")
                          return 200, r.text
                      log(f"    [PROXY {i+1}/{len(proxies)}] {r.status_code} em {dt:.1f}s - próxima")
                  except Exception as e:
                      log(f"    [PROXY {i+1}/{len(proxies)}] Erro: {str(e)[:60]}")
              log(f"    [PROXY] Todos falharam.")
              return 429, ""


          _VIDEO_RE_HREF = re.compile(
              r"tankie\.tube/(?:w|v|videos/embed)/"
              r"|oneplayer\.site/"
              r"|\.mp4(?:\?|$)"
              r"|\.m3u8(?:\?|$)",
              re.I
          )

          _VIDEO_RE_HTML = re.compile(
              r"https?://[^\"'\s<>]*(?:"
              r"tankie\.tube/(?:videos/embed|w|v)/[^\"'\s<>]+"
              r"|oneplayer\.site/[^\"'\s<>]+"
              r"|[^\"'\s<>]+\.(?:mp4|m3u8)(?:\?[^\"'\s<>]*)?"
              r")",
              re.I
          )

          _VIDEO_RE = re.compile(r"\.mp4|\.m3u8|tankie\.tube|oneplayer\.site", re.I)
          _EP_LISTA_RE = re.compile(
              r"epis[oó]dio[-_/]\d+|\bepis[oó]dio\s+\d+|lista de epis[oó]dios|\b\d+\s*[ªº°]\s*temporada", re.I)
          _CAT_SERIE_RE = re.compile(r"s[eé]rie|temporada|season|novela|anime|doram|epis[oó]dio", re.I)
          _CAT_FILME_RE = re.compile(r"filme|movie", re.I)
          _TITULO_MULTI = re.compile(
              r"\b(saga|cole[çc][ãa]o|colet[âa]nea|quadrilogia|duologia|trilogia|box)\b", re.I)
          CONTEUDO_MIN = 150


          def normalizar_link_video(link):
              if not link:
                  return link
              m = re.match(r"https?://tankie\.tube/w/([a-zA-Z0-9]+)", link)
              if m:
                  METRICAS["link_convertido_w2embed"] += 1
                  return f"https://tankie.tube/videos/embed/{m.group(1)}"
              return link


          def classificar_entrada(entry):
              cats = [str(c.get("term", "")) for c in entry.get("category", []) if isinstance(c, dict)]
              conteudo = ""
              for campo in ("content", "summary"):
                  v = entry.get(campo)
                  if isinstance(v, dict) and v.get("$t"):
                      conteudo += v["$t"]
              if len(conteudo) < CONTEUDO_MIN:
                  return "incerto"
              cat_serie = any(_CAT_SERIE_RE.search(c) for c in cats)
              cat_filme = any(_CAT_FILME_RE.search(c) for c in cats)
              ep_lista = bool(_EP_LISTA_RE.search(conteudo))
              tem_video = bool(_VIDEO_RE.search(conteudo))
              if ep_lista:
                  return "serie"
              if cat_serie and not tem_video:
                  return "serie"
              if tem_video and not cat_serie:
                  return "filme"
              if cat_filme and not cat_serie:
                  return "filme"
              return "incerto"


          FEED_INFO = {"total_esperado": 0}


          def buscar_entradas_feed():
              entradas, vistos = [], set()
              start, completo = 1, True
              FEED_INFO["total_esperado"] = 0
              while True:
                  url_feed = f"{BASE_URL}/feeds/posts/default?alt=json&max-results=150&start-index={start}"
                  status, texto = http_get(url_feed, timeout=30)
                  if status != 200:
                      log(f"Feed: página start-index={start} falhou (status={status}).")
                      evento("feed_pagina_falhou", url_feed, status=status)
                      completo = False
                      break
                  try:
                      feed = json.loads(texto).get("feed", {})
                      entries = feed.get("entry", []) or []
                  except Exception as e:
                      log(f"Feed: JSON inválido em start-index={start}: {e}")
                      evento("feed_json_invalido", url_feed, detalhe=str(e)[:120])
                      METRICAS["html_invalido"] += 1
                      completo = False
                      break
                  try:
                      FEED_INFO["total_esperado"] = int(feed.get("openSearch$totalResults", {}).get("$t") or 0)
                  except Exception:
                      pass
                  if not entries:
                      break
                  for e in entries:
                      link = next((l["href"] for l in e.get("link", []) if l.get("rel") == "alternate"), None)
                      if link:
                          u = link.split("?")[0].strip()
                          if u and u not in vistos:
                              vistos.add(u)
                              corpo = ""
                              for campo in ("content", "summary"):
                                  v = e.get(campo)
                                  if isinstance(v, dict) and v.get("$t"):
                                      corpo = v["$t"]
                                      break
                              entradas.append({"url": u, "tipo": classificar_entrada(e),
                                               "titulo": (e.get("title") or {}).get("$t", "") or "", "conteudo": corpo})
                  start += 150
                  if len(entries) < 150:
                      break
              total = FEED_INFO["total_esperado"]
              if completo and total and len(entradas) < total * 0.98:
                  log(f"Feed: vieram {len(entradas)}, site informa {total}. Tratando como INCOMPLETO.")
                  evento("feed_incompleto", BASE_URL, recebidos=len(entradas), esperados=total)
                  completo = False
              return entradas, completo


          def buscar_urls_feed():
              entradas, completo = buscar_entradas_feed()
              return [e["url"] for e in entradas], completo


          def indice_do_feed():
              if (os.environ.get("USAR_FEED") or "1") == "0":
                  return {}
              entradas, completo = buscar_entradas_feed()
              log(f"Feed: {len(entradas)} posts em memória" + ("" if completo else " (INCOMPLETO: o resto vem das páginas)"))
              return {e["url"]: e for e in entradas}


          def pagina_do_feed(ent):
              t = _esc(ent.get("titulo", ""))
              return f"<html><head><title>{t}</title></head><body><h1>{t}</h1>{ent.get('conteudo', '')}</body></html>"


          import asyncio, base64, unicodedata
          import html as htmllib
          from urllib.parse import urlparse
          from bs4 import BeautifulSoup, NavigableString

          PAGES_URL = "https://api-pobreflix-filmes.pages.dev"
          PLACEHOLDER = "https://placehold.co/500x750?text=Sem+Capa"
          SUFIXO = "🍿Clau"
          MARCADOR_FORMATO = 'data-rave="2"'

          MAX_TENTATIVAS = 6
          LOTE_SIZE = int(os.environ.get("LOTE_SIZE") or 100)
          MODO = (os.environ.get("MODO_EXECUCAO") or "baixar_e_consertar").lower()
          FALTAM_ARQ = Path(os.environ.get("FALTAM_FILE") or "/tmp/faltam.txt")
          TEMPO_MAX_MIN = int(os.environ.get("TEMPO_MAX_MIN") or 345)
          TEMPO_MAX = TEMPO_MAX_MIN * 60
          T0 = time.time()


          def tempo_esgotado():
              return TEMPO_MAX > 0 and (time.time() - T0) > TEMPO_MAX


          def escrever_atomico(destino, texto):
              destino = Path(destino)
              tmp = destino.with_name(destino.name + ".tmp")
              tmp.write_text(texto, encoding="utf-8")
              tmp.replace(destino)


          _PAGINA_BLOQUEIO = re.compile(
              r"too many requests|rate limit|error 1015|access denied|just a moment|attention required|"
              r"checking your browser|captcha|temporarily unavailable|service unavailable|bad gateway|"
              r"gateway time-?out|erro 429|muitas requisi", re.I)


          def motivo_html_invalido(html):
              if not html or not isinstance(html, str):
                  return "vazio"
              if len(html) < 2000:
                  return f"curto ({len(html)} bytes)"
              if not re.search(r"<html", html[:3000], re.I):
                  return "sem <html>"
              if not re.search(r"</html\s*>", html[-1500:], re.I):
                  return "truncado (sem </html>)"
              soup = BeautifulSoup(html, "html.parser")
              if not soup.find("title") and not soup.find("h1"):
                  return "sem título/h1"
              titulo = (soup.title.string or "") if soup.title else ""
              if _PAGINA_BLOQUEIO.search(titulo):
                  return f"página de erro/bloqueio ({titulo.strip()[:40]})"
              if len(html) < 30000 and _PAGINA_BLOQUEIO.search(soup.get_text(" ", strip=True)[:1500]):
                  return "página de erro/bloqueio"
              return None


          def validar_html(html, url):
              motivo = motivo_html_invalido(html)
              if motivo:
                  METRICAS["html_invalido"] += 1
                  evento("html_invalido", url, detalhe=motivo)
                  log(f"    (HTML inválido para {url}: {motivo})")
                  return False
              return True


          async def renderizar(context, url, espera=5.0):
              return ""


          def carregar_json(arq, padrao):
              try:
                  return json.loads(Path(arq).read_text(encoding="utf-8"))
              except Exception:
                  return padrao


          def salvar_json(arq, dados):
              Path(arq).write_text(json.dumps(dados, ensure_ascii=False, indent=2), encoding="utf-8")


          def carregar_pendentes(arq):
              por_arquivo = {}
              for p in carregar_json(arq, []):
                  if not isinstance(p, dict) or "arquivo" not in p:
                      continue
                  if p["arquivo"] in por_arquivo:
                      ant = por_arquivo[p["arquivo"]]
                      ant["tentativas"] = max(ant.get("tentativas", 1), p.get("tentativas", 1))
                  else:
                      p.setdefault("tentativas", 1)
                      por_arquivo[p["arquivo"]] = p
              return list(por_arquivo.values())


          def anexar_linha(arq, linha):
              with open(arq, "a", encoding="utf-8") as f:
                  f.write(linha.strip() + "\n")


          ARQ_REVISAR = Path("revisar.txt")
          _REVISAR_VISTOS = set()


          def registrar_revisao(url, motivo):
              """Arquivo unificado revisar.txt: uma linha 'URL | motivo' por caso que precisa de olho humano."""
              motivo = re.sub(r"\s+", " ", str(motivo)).strip()
              linha = f"{url} | {motivo}"
              try:
                  if not _REVISAR_VISTOS and ARQ_REVISAR.exists():
                      _REVISAR_VISTOS.update(l.strip() for l in ARQ_REVISAR.read_text(encoding="utf-8").splitlines())
                  if linha in _REVISAR_VISTOS:
                      return
                  _REVISAR_VISTOS.add(linha)
                  with open(ARQ_REVISAR, "a", encoding="utf-8") as f:
                      f.write(linha + "\n")
              except Exception as e:
                  log(f"    (não consegui gravar revisar.txt: {e})")


          def ler_ld(soup):
              for s in soup.find_all("script", type="application/ld+json"):
                  try:
                      dados = json.loads(s.string or s.get_text())
                  except Exception:
                      continue
                  pilha = dados if isinstance(dados, list) else [dados]
                  for item in pilha:
                      if not isinstance(item, dict):
                          continue
                      if isinstance(item.get("@graph"), list):
                          for sub in item["@graph"]:
                              if isinstance(sub, dict):
                                  yield sub
                      yield item


          def como_lista(v):
              if isinstance(v, str):
                  return [v]
              if isinstance(v, dict):
                  return como_lista(v.get("url"))
              if isinstance(v, list):
                  saida = []
                  for x in v:
                      saida.extend(como_lista(x))
                  return saida
              return []


          _PREFIXO = re.compile(
              r"^(?:(?i:marc[øo]s\s*x\s*7|vini\s*7x)"
              r"|(?:(?i:entre[ _-]nos|inix)|arc)(?=[\s\-_:|]))[\s\-_:|]*"
          )
          _ANO_RE = r"(?<!\d)(?:19|20)\d{2}(?!\d)"


          def ano_da_url(url):
              m = re.search(r"/([^/?#]+?)(?:\.html)?(?:[?#].*)?$", url or "")
              if not m:
                  return ""
              anos = re.findall(_ANO_RE, m.group(1))
              return anos[-1] if anos else ""


          def extrair_ano(titulo_bruto, url):
              ano = ano_da_url(url)
              if ano:
                  return ano
              m = re.search(r"[(\[]\s*((?:19|20)\d{2})\s*[)\]]", str(titulo_bruto or ""))
              return m.group(1) if m else ""


          def _titulo_pela_url(url):
              m = re.search(r"/([^/?#]+?)\.html", url or "")
              if not m:
                  return ""
              slug = m.group(1)
              slug = re.sub(r"^(?:inix|arc|entre-nos)[-_]", "", slug, flags=re.I)
              slug = re.sub(r"[-_]\d{4}$", "", slug)
              palavras = slug.replace("-", " ").replace("_", " ").split()
              return " ".join(p[:1].upper() + p[1:] for p in palavras)


          _LIXO_SITE = re.compile(r"\U0001F47E+\ufe0f?|(?:\bdo\s+)?@?vini\s*7x\w*|marc[øo_]\s*s\s*x\s*7(?![0-9])", re.I)


          def tirar_lixo_do_site(t):
              t = unicodedata.normalize("NFKC", str(t or ""))
              t = _LIXO_SITE.sub(" ", t)
              t = re.sub(r"\s+", " ", t)
              t = re.sub(r"(?:\s*[-–—|:]\s*){2,}", " - ", t)
              return t.strip(" -–—|:")


          def limpar_titulo_bruto(titulo, url="", fallback=True, serie=False):
              t = str(titulo or "")
              if re.search(r"https?:|\.html?\b", t, re.I):
                  t = ""
              t = unicodedata.normalize("NFKC", t).replace(SUFIXO, "")
              t = tirar_lixo_do_site(t)
              # Site: "Nome [2021] ‧ Ação/Comédia" -> fica só "Nome" (o ano é lido à parte por extrair_ano)
              t = re.sub(r"\s*\[\s*(?:19|20)\d{2}\s*\].*$", "", t)
              t = re.sub(r"\s*[\u2027\u00b7\u2022]\s*.*$", "", t).strip(" -–—|:")
              for _ in range(3):
                  novo = _PREFIXO.sub("", t, count=1).strip(" -–—|:_")
                  if novo == t:
                      break
                  t = novo
              t = re.sub(r"^(?:assistir|baixar|download)\s+", "", t, flags=re.I)
              t = re.sub(
                  r"\s*[-–—|]\s*(?:assistir|online|filme|completo|dublado|legendado|hd|temporada|serie|série|download).*$",
                  "", t, flags=re.I)
              t = re.sub(r"(?:\s+(?:dublado|legendado|online|completo|hdcam|hdts|webrip|cam))+$", "", t, flags=re.I)
              t = re.sub(r"\s*[-–—]\s*(?:\d+\s*[ªº°ao]?\s*)?(?:temporada|season)\b.*$", "", t, flags=re.I)
              t = re.sub(r"\s+\d+\s*[ªº°ao]\s*temporada\b.*$", "", t, flags=re.I)
              ano_url = ano_da_url(url)
              for _ in range(3):
                  novo = re.sub(r"\s*\(\s*(?:19|20)\d{2}\s*\)\s*$", "", t)
                  if ano_url:
                      novo = re.sub(r"\s+" + ano_url + r"\s*$", "", novo)
                  if serie:
                      novo = re.sub(r"\s+(?:19|20)\d{2}\s*$", "", novo)
                  novo = novo.strip(" -–—|:")
                  if novo == t:
                      break
                  t = novo
              if len(t) < 3 and fallback:
                  t = _titulo_pela_url(url)
              return t.strip()


          def candidatos_titulo(soup):
              c = []
              h1 = soup.find("h1", class_="post-title") or soup.find("h1")
              if h1:
                  c.append(h1.get_text(" ", strip=True))
              og = soup.find("meta", property="og:title")
              if og and og.get("content"):
                  c.append(og["content"])
              if soup.title and soup.title.string:
                  c.append(soup.title.string)
              return c


          def escolher_titulo(soup, url, serie=False):
              for raw in candidatos_titulo(soup):
                  t = limpar_titulo_bruto(raw, url, fallback=False, serie=serie)
                  if len(t) >= 3:
                      return t, extrair_ano(raw, url)
              return limpar_titulo_bruto("", url, serie=serie), extrair_ano("", url)


          def fazer_slug(titulo, url=""):
              t = unicodedata.normalize("NFKD", str(titulo or ""))
              t = "".join(c for c in t if not unicodedata.combining(c))
              s = re.sub(r"[^a-z0-9]", "_", t.lower())
              s = re.sub(r"_+", "_", s).strip("_")
              if not s:
                  m = re.search(r"/([^/?#]+?)(?:\.html)?(?:[?#].*)?$", url or "")
                  s = re.sub(r"[^a-z0-9]+", "_", (m.group(1) if m else "").lower()).strip("_")
              return s or "sem_titulo"


          def is_icon_url(url):
              if not url:
                  return True
              u = str(url).lower()
              if "placeholder" in u or "placehold.co" in u or "sem+capa" in u:
                  return True
              caminho = urlparse(u).path
              if re.search(r"(?:^|[/_.\-])(?:favicon|icon|logo|avatar)s?(?:[/_.\-0-9]|$)", caminho):
                  return True
              if re.search(r"\.(?:ico|svg)$", caminho):
                  return True
              if re.search(r"[=/]s(?:16|24|32|48|64|72|96)(?:-[a-z]+)?(?:[/?]|$)", u):
                  return True
              return False


          def normalizar_url(u):
              u = (u or "").strip()
              if u.startswith("//"):
                  u = "https:" + u
              if u.startswith("http://"):
                  u = "https://" + u[7:]
              return u


          def capa_valida(u):
              u = normalizar_url(u)
              return len(u) >= 10 and u.startswith("https://") and not is_icon_url(u)


          def corpo_post(soup):
              return soup.select_one(".post-body, .entry-content, article") or soup


          def escolher_capa(soup, html_text=""):
              candidatas = []
              for ld in ler_ld(soup):
                  candidatas += como_lista(ld.get("thumbnailUrl"))
                  candidatas += como_lista(ld.get("image"))
              for prop in ("og:image", "twitter:image"):
                  m = soup.find("meta", property=prop) or soup.find("meta", attrs={"name": prop})
                  if m and m.get("content"):
                      candidatas.append(m["content"])
              for img in corpo_post(soup).find_all("img"):
                  for attr in ("src", "data-src"):
                      if img.get(attr):
                          candidatas.append(img[attr])
              candidatas += re.findall(r"https://blogger\.googleusercontent\.com/img/[^\"'\s<>]+", html_text or "")
              for c in candidatas:
                  c = normalizar_url(c)
                  if capa_valida(c):
                      return c
              return PLACEHOLDER


          def extrair_link_estatico(html_text, soup=None):
              soup = soup or BeautifulSoup(html_text, "html.parser")
              for ld in ler_ld(soup):
                  v = ld.get("contentUrl")
                  if isinstance(v, str) and v.startswith("http"):
                      return normalizar_link_video(v)
              for a in soup.find_all("a", href=True):
                  href = a["href"].strip()
                  if _VIDEO_RE_HREF.search(href):
                      METRICAS["link_em_a_href"] += 1
                      return normalizar_link_video(href)
              m = _VIDEO_RE_HTML.search(html_text)
              if m:
                  return normalizar_link_video(m.group(0))
              for tag in soup.find_all(["video", "source"]):
                  src = tag.get("src") or ""
                  if src.startswith("http"):
                      return normalizar_link_video(src)
              return None


          def extrair_todos_links_video(html_text, soup=None):
              soup = soup or BeautifulSoup(html_text, "html.parser")
              links = []
              vistos = set()

              for ld in ler_ld(soup):
                  v = ld.get("contentUrl")
                  if isinstance(v, str) and v.startswith("http"):
                      v = normalizar_link_video(v)
                      if v not in vistos:
                          vistos.add(v)
                          links.append({"link": v, "texto": ""})

              for a in soup.find_all("a", href=True):
                  href = a["href"].strip()
                  if _VIDEO_RE_HREF.search(href):
                      href = normalizar_link_video(href)
                      if href not in vistos:
                          vistos.add(href)
                          texto = a.get_text(" ", strip=True)
                          links.append({"link": href, "texto": texto})

              for m in _VIDEO_RE_HTML.finditer(html_text):
                  l = normalizar_link_video(m.group(0))
                  if l not in vistos:
                      vistos.add(l)
                      links.append({"link": l, "texto": ""})

              for tag in soup.find_all(["video", "source"]):
                  src = tag.get("src") or ""
                  if src.startswith("http"):
                      src = normalizar_link_video(src)
                      if src not in vistos:
                          vistos.add(src)
                          links.append({"link": src, "texto": ""})

              return links


