name: Atualizar Filas com Novos Posts
 
on:
  schedule:
    - cron: '0 * * * *' # Roda a cada 1 hora (no minuto 0)
  workflow_dispatch:    # Permite rodar manualmente também
    inputs:
      reclassificar:
        description: 'Tirar das filas atuais as URLs do tipo errado (filmes x séries)?'
        required: false
        default: false
        type: boolean
 
permissions:
  contents: write
 
concurrency:
  group: atualizar-filas
  cancel-in-progress: false
 
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
 
      - name: Instalar dependências
        run: pip install requests
 
      - name: Atualizar filas
        env:
          RECLASSIFICAR: ${{ inputs.reclassificar == true || inputs.reclassificar == 'true' }}
        run: |
          cat > /tmp/atualizar_filas.py << 'PYEOF'
          import requests, sys, os, json, time, re
          from pathlib import Path
 
          BASE_URL = "https://www.vini7xgrave.site"
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
 
 
          def log(*a):
              print(*a, flush=True)
 
 
          def ler_linhas(arq):
              """Lê um .txt de URLs: ignora vazios e duplicados, MANTÉM a ordem."""
              arq = Path(arq)
              if not arq.exists():
                  return []
              vistos, saida = set(), []
              for linha in arq.read_text(encoding="utf-8").splitlines():
                  linha = linha.strip()
                  if linha and linha not in vistos:
                      vistos.add(linha)
                      saida.append(linha)
              return saida
 
 
          def escrever_linhas(arq, linhas):
              """Escrita atômica (arquivo temporário + replace) para nunca deixar a fila pela metade."""
              arq = Path(arq)
              tmp = arq.with_name(arq.name + ".tmp")
              tmp.write_text("\n".join(linhas) + ("\n" if linhas else ""), encoding="utf-8")
              tmp.replace(arq)
 
 
          _VIDEO_RE = re.compile(r"\.mp4|\.m3u8|tankie\.tube/videos/embed|oneplayer\.site", re.I)
          _EP_LISTA_RE = re.compile(
              r"epis[oó]dio[-_/]\d+|\bepis[oó]dio\s+\d+|lista de epis[oó]dios|\b\d+\s*[ªº°]\s*temporada", re.I)
          _CAT_SERIE_RE = re.compile(r"s[eé]rie|temporada|season|novela|anime|doram|epis[oó]dio", re.I)
          _CAT_FILME_RE = re.compile(r"filme|movie", re.I)
 
 
          def classificar_entrada(entry):
              """Classifica um post do feed SEM abrir a página: 'serie', 'filme' ou 'incerto'.
              Usa as categorias (marcadores) do Blogger e o HTML do post que já vem no feed."""
              cats = [str(c.get("term", "")) for c in entry.get("category", []) if isinstance(c, dict)]
              conteudo = ""
              for campo in ("content", "summary"):
                  v = entry.get(campo)
                  if isinstance(v, dict) and v.get("$t"):
                      conteudo += v["$t"]
              cat_serie = any(_CAT_SERIE_RE.search(c) for c in cats)
              cat_filme = any(_CAT_FILME_RE.search(c) for c in cats)
              ep_lista = bool(_EP_LISTA_RE.search(conteudo))
              tem_video = bool(_VIDEO_RE.search(conteudo))
              if ep_lista:
                  return "serie"
              if cat_serie and not tem_video:
                  return "serie"
              if tem_video and not cat_serie:
                  return "filme"
              if cat_filme and not cat_serie:
                  return "filme"
              return "incerto"   # na dúvida o post entra nas DUAS filas (cada robô ainda confere a página)
 
 
          def buscar_entradas_feed():
              """Percorre o feed do Blogger. Retorna ([{'url','tipo'}...] na ordem do feed, completo?)."""
              entradas, vistos = [], set()
              start, completo = 1, True
              while True:
                  url_feed = f"{BASE_URL}/feeds/posts/default?alt=json&max-results=150&start-index={start}"
                  entries = None
                  for tentativa in range(3):
                      try:
                          r = requests.get(url_feed, headers=HEADERS, timeout=20)
                          if r.status_code == 200:
                              entries = r.json().get("feed", {}).get("entry", [])
                              break
                          log(f"Feed HTTP {r.status_code} (tentativa {tentativa + 1}/3)")
                      except Exception as e:
                          log(f"Erro ao buscar feed: {e} (tentativa {tentativa + 1}/3)")
                      time.sleep(2 * (tentativa + 1))
                  if entries is None:
                      completo = False
                      break
                  if not entries:
                      break
                  for e in entries:
                      link = next((l["href"] for l in e.get("link", []) if l.get("rel") == "alternate"), None)
                      if link:
                          u = link.split("?")[0].strip()
                          if u and u not in vistos:
                              vistos.add(u)
                              entradas.append({"url": u, "tipo": classificar_entrada(e)})
                  start += 150
                  if len(entries) < 150:
                      break
              return entradas, completo
 
 
          def buscar_urls_feed():
              """Só as URLs (usado pelos robôs para criar a fila quando ela ainda não existe)."""
              entradas, completo = buscar_entradas_feed()
              return [e["url"] for e in entradas], completo
 
 
          ARQ_FILA_FILMES = Path("filmes_fila.txt")
          ARQ_FILA_SERIES = Path("series_fila.txt")
          RECLASSIFICAR = (os.environ.get("RECLASSIFICAR") or "false").lower() == "true"
 
 
          def separar(entradas):
              """Filmes -> fila de filmes; séries -> fila de séries; 'incerto' -> as duas."""
              filmes = [e["url"] for e in entradas if e["tipo"] in ("filme", "incerto")]
              series = [e["url"] for e in entradas if e["tipo"] in ("serie", "incerto")]
              return filmes, series
 
 
          def atualizar_fila(arq, candidatas):
              """Coloca as URLs novas NO INÍCIO da fila (posts recentes primeiro) e preserva a ordem do resto."""
              atuais = ler_linhas(arq)
              existentes = set(atuais)
              novas = [u for u in candidatas if u not in existentes]
              if novas:
                  escrever_linhas(arq, novas + atuais)
              return len(atuais), len(novas)
 
 
          def reclassificar_fila(arq, tipos, remover):
              """Tira da fila as URLs que o feed diz serem do outro tipo. O progresso (feitos) não é tocado."""
              atuais = ler_linhas(arq)
              mantidas = [u for u in atuais if tipos.get(u) != remover]
              if len(mantidas) != len(atuais):
                  escrever_linhas(arq, mantidas)
              return len(atuais) - len(mantidas)
 
 
          def main():
              log("Buscando todas as URLs do site...")
              entradas, completo = buscar_entradas_feed()
              log(f"Encontradas {len(entradas)} URLs no site." + ("" if completo else " (feed incompleto)"))
              if not entradas:
                  log("⚠️ Feed vazio ou com erro: as filas não foram alteradas.")
                  return
 
              contagem = {t: sum(1 for e in entradas if e["tipo"] == t) for t in ("filme", "serie", "incerto")}
              log(f"Classificação pelo feed: {contagem['filme']} filmes | {contagem['serie']} séries | "
                  f"{contagem['incerto']} incertos (vão para as duas filas)")
 
              filmes, series = separar(entradas)
              for arq, cand in ((ARQ_FILA_FILMES, filmes), (ARQ_FILA_SERIES, series)):
                  antes, novas = atualizar_fila(arq, cand)
                  if novas:
                      log(f"🆕 {arq.name}: +{novas} URLs novas (antes: {antes}, agora: {antes + novas}).")
                  else:
                      log(f"✅ {arq.name}: nenhuma URL nova (total: {antes}).")
 
              if RECLASSIFICAR:
                  tipos = {e["url"]: e["tipo"] for e in entradas}
                  r1 = reclassificar_fila(ARQ_FILA_FILMES, tipos, "serie")
                  r2 = reclassificar_fila(ARQ_FILA_SERIES, tipos, "filme")
                  log(f"♻️ Reclassificação: {r1} séries saíram da fila de filmes, {r2} filmes saíram da fila de séries.")
 
 
          if __name__ == "__main__":
              main()
 
          PYEOF
          python3 /tmp/atualizar_filas.py
 
      - name: Salvar arquivos e progresso
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
 
          git add -A
          git reset .github/ 2>/dev/null || true
 
          if git diff --cached --quiet; then echo "Nada novo nas filas."; exit 0; fi
          git commit -m "chore: atualizar filas com novos posts do site"
 
          ok=0
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then ok=1; break; fi
            echo "Conflito detectado. Sincronizando de forma segura..."
            git pull origin main --no-rebase -X ours --no-edit
            git add -A
            git reset .github/ 2>/dev/null || true
            git commit -m "chore: retry atualizar filas $i" || true
            sleep $((RANDOM % 10 + 5))
          done
          if [ "$ok" != "1" ]; then echo "::error::Não consegui dar push depois de 5 tentativas"; exit 1; fi
