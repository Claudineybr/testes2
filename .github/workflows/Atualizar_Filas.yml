name: Atualizar Filas com Novos Posts

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      apagar_filas:
        description: '⚠️ APAGAR e reconstruir filas do zero'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: atualizar-filas
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar dependências
        run: pip install requests

      - name: Atualizar filas
        env:
          APAGAR_FILAS: ${{ inputs.apagar_filas || 'false' }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cat > /tmp/atualizar_filas.py << 'PYEOF'
          import requests, sys, os, re, json, time
          from pathlib import Path

          BASE_URL = "https://www.vini7xgrave.site"
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
          TMDB_BASE = "https://api.themoviedb.org/3"
          TMDB_KEY = os.environ.get("TMDB_API_KEY", "").strip()
          TMDB_RATE = 4.0

          ARQ_FILA_FILMES = Path("filmes_fila.txt")
          ARQ_FILA_SERIES = Path("series_fila.txt")
          ARQ_TMDB_CACHE  = Path("tmdb_cache.json")

          APAGAR_FILAS = os.environ.get("APAGAR_FILAS", "false").lower() == "true"
          CACHE_VERSION = "v7"

          SERIES_LABELS = {
              "séries", "série", "series", "seriados",
              "animes", "anime", "doramas", "episódios",
              "temporada", "season",
          }

          _ANO_RE = r"(?<!\d)(?:19|20)\d{2}(?!\d)"

          def log(*a): print(*a, flush=True); sys.stdout.flush()

          cache = {}
          if ARQ_TMDB_CACHE.exists():
              try:
                  cache_raw = json.loads(ARQ_TMDB_CACHE.read_text(encoding="utf-8"))
                  for k, v in cache_raw.items():
                      if k.startswith(f"{CACHE_VERSION}|"):
                          cache[k] = v
              except Exception:
                  pass

          def salvar_cache():
              try:
                  ARQ_TMDB_CACHE.write_text(
                      json.dumps(cache, ensure_ascii=False, indent=2),
                      encoding="utf-8",
                  )
              except Exception:
                  pass

          _ultima = [0.0]

          def _tmdb_get(endpoint, params):
              falta = _ultima[0] + (1.0 / TMDB_RATE) - time.time()
              if falta > 0:
                  time.sleep(falta)
              _ultima[0] = time.time()
              try:
                  r = requests.get(f"{TMDB_BASE}{endpoint}", params=params, timeout=15)
                  if r.status_code == 429:
                      time.sleep(5)
                      r = requests.get(f"{TMDB_BASE}{endpoint}", params=params, timeout=15)
                  return r
              except Exception:
                  return None

          def extrair_titulo_da_url(url):
              m = re.search(r'/([^/]+)\.html', url)
              if not m:
                  return None
              slug = m.group(1)

              for _ in range(10):
                  novo = re.sub(r'^(?:inix|arc|entre[_-]?nos|vini7x|marcos)[-_]', '', slug, flags=re.I)
                  if novo == slug:
                      break
                  slug = novo

              slug = re.sub(r'_\d{1,3}$', '', slug)
              slug = re.sub(r'_\d{5,}$', '', slug)

              m_ano = re.search(r'[-_]((?:19|20)\d{2})(?:[-_]|$)', slug)
              if m_ano:
                  slug = slug[:m_ano.start()]

              slug = re.sub(r'[-_]\d{4}$', '', slug)
              for gen in ("acaocomedia", "acaoficcao", "acaothriller", "terrorsuspense",
                          "terrormisterio", "infantilfantasia", "infantilacao",
                          "infantilaventura", "comediaanimacao", "terrorsobrenatural",
                          "ficcao", "terror", "suspense", "comedia", "acao",
                          "aventura", "infantil", "animacao", "drama", "romance"):
                  slug = re.sub(rf'[-_]{gen}$', '', slug, flags=re.I)

              if len(slug) < 3:
                  return None
              return slug.replace('-', ' ').replace('_', ' ').strip()

          def extrair_ano_da_url(url):
              m = re.search(r"/([^/?#]+?)(?:\.html)?(?:[?#].*)?$", url or "")
              if not m:
                  return None
              anos = re.findall(_ANO_RE, m.group(1))
              return anos[-1] if anos else None

          def tmdb_classificar(titulo, ano):
              if not TMDB_KEY or not titulo:
                  return None

              chave = f"{CACHE_VERSION}|{titulo.lower().strip()}|{ano or ''}"
              if chave in cache:
                  return cache[chave]

              r = _tmdb_get("/search/multi", {
                  "api_key": TMDB_KEY,
                  "query": titulo,
                  "language": "pt-BR",
                  "include_adult": "false",
              })

              if r is None or r.status_code != 200:
                  cache[chave] = None
                  return None

              results = [
                  x for x in r.json().get("results", [])
                  if x.get("media_type") in ("movie", "tv")
              ]
              if not results:
                  cache[chave] = None
                  return None

              top = results[0]
              tipo_top = top.get("media_type")

              if ano:
                  data_top = top.get("release_date") or top.get("first_air_date") or ""
                  ano_top = data_top.split("-")[0] if data_top else ""
                  if ano_top != ano:
                      for res in results[1:10]:
                          tipo_r = res.get("media_type")
                          data_r = res.get("release_date") or res.get("first_air_date") or ""
                          ano_r = data_r.split("-")[0] if data_r else ""
                          if ano_r == ano and tipo_r != tipo_top:
                              cache[chave] = tipo_r
                              return tipo_r

              cache[chave] = tipo_top
              return tipo_top

          INTERVALO_FEED = float(os.environ.get("INTERVALO_FEED_SEG") or 15)   # Blogger: ~11-12 req/min por IP -> 4 req/min


          def _get_feed_pagina(url_feed):
              """GET com espera entre tentativas: 429/5xx -> Retry-After (ou 60s, 120s, 240s). Retorna o JSON ou None."""
              for tentativa in range(4):
                  try:
                      r = requests.get(url_feed, headers=HEADERS, timeout=30)
                  except Exception as e:
                      log(f"  ❌ Erro de rede no feed: {str(e)[:100]} (tentativa {tentativa + 1}/4)")
                      time.sleep(10 * (tentativa + 1))
                      continue
                  if r.status_code == 200:
                      try:
                          return r.json()
                      except Exception as e:
                          log(f"  ❌ JSON inválido no feed: {e}")
                          return None
                  if r.status_code in (429, 500, 502, 503, 504):
                      ra = r.headers.get("Retry-After", "")
                      espera = float(ra) if ra.isdigit() else min(300, 60 * (2 ** tentativa))
                      log(f"  ⏳ Feed HTTP {r.status_code} (tentativa {tentativa + 1}/4): aguardando {espera:.0f}s...")
                      if tentativa < 3:
                          time.sleep(min(espera, 300))
                      continue
                  log(f"  ⚠️ Feed HTTP {r.status_code}")
                  return None
              return None


          def get_all_entries(conhecidas=None):
              """Percorre o feed (mais novo primeiro). Com `conhecidas` (URLs que já estão nas filas), PARA na primeira
              página sem nenhuma URL nova: no dia a dia é 1 requisição por hora em vez de 31. Sem `conhecidas`
              (modo apagar/reconstruir) percorre tudo, com 15s entre páginas."""
              entries = {}
              start, completo = 1, True
              while True:
                  url_feed = (f"{BASE_URL}/feeds/posts/default?alt=json"
                              f"&max-results=150&start-index={start}")
                  dados = _get_feed_pagina(url_feed)
                  if dados is None:
                      log(f"  ⚠️ Feed falhou em start={start}; uso o que já veio.")
                      completo = False
                      break
                  feed_entries = dados.get("feed", {}).get("entry", [])
                  if not feed_entries:
                      break
                  novas_na_pagina = 0
                  for e in feed_entries:
                      link = next((l["href"] for l in e.get("link", []) if l.get("rel") == "alternate"), None)
                      if not link:
                          continue
                      url = link.split("?")[0].strip()
                      labels = {c.get("term", "").strip().lower() for c in e.get("category", []) if c.get("term")}
                      conteudo = ""
                      for campo in ("content", "summary"):
                          v = e.get(campo)
                          if isinstance(v, dict) and v.get("$t"):
                              conteudo = v["$t"]
                              break
                      if conhecidas is not None and url not in conhecidas:
                          novas_na_pagina += 1
                      entries[url] = {"labels": labels, "conteudo": conteudo}
                  start += 150
                  if len(feed_entries) < 150:
                      break
                  if conhecidas is not None and novas_na_pagina == 0:
                      log("  (página inteira já conhecida: o resto do feed também; paro por aqui)")
                      break
                  time.sleep(INTERVALO_FEED)
              return entries, completo


          def detectar_serie_no_conteudo(conteudo):
              if not conteudo:
                  return False, None
              c_lower = conteudo.lower()

              eps_n = set(re.findall(r"\bepis[oó]dios?\s*(\d+)", c_lower))
              if len(eps_n) >= 2:   # 1 menção só pode ser título de filme ("Star Wars: Episódio 1")
                  return True, f"conteúdo: {len(eps_n)} episódios distintos"

              if re.search(r"\bT\d{1,2}\s*E\d{1,3}\b", conteudo):
                  n = len(re.findall(r"\bT\d{1,2}\s*E\d{1,3}\b", conteudo))
                  return True, f"conteúdo: {n}× TNE"

              n_temp = len(re.findall(r"\btemporadas?\s*\d+", c_lower))
              if n_temp >= 3:
                  return True, f"conteúdo: {n_temp}× Temporada(s) N"

              links = re.findall(r"<a\b[^>]*>([^<]{1,100})</a>", conteudo, re.I)
              n_ep = 0
              for txt in links:
                  t = txt.strip()
                  if re.match(r"^\s*(?:\d{1,3}\s*[\.\-–—:]\s*)?(?:epis[oó]dio|cap[ií]tulo)\s*\d+", t, re.I):
                      n_ep += 1
                  elif re.match(r"^\s*\d{1,3}\s*[\.\-–—:]\s+\S", t):
                      n_ep += 1
              if n_ep >= 3:
                  return True, f"conteúdo: {n_ep} links episódio/capítulo"

              return False, None

          def classificar_url(url, labels, conteudo):
              if labels & SERIES_LABELS:
                  return {"classe": "serie", "motivos": [f"label: {sorted(labels & SERIES_LABELS)}"]}

              eh, motivo = detectar_serie_no_conteudo(conteudo)
              if eh:
                  return {"classe": "serie", "motivos": [motivo]}

              m = re.search(r"/([^/]+?)\.html", url)
              slug = (m.group(1).lower() if m else "")
              if re.search(r"temporada|season", slug):
                  return {"classe": "serie", "motivos": ["URL: temporada/season"]}

              # post com UM vídeo direto (JSON-LD VideoObject) e sem lista de episódios = filme (sem gastar TMDB)
              if re.search(r'"contentUrl"\s*:\s*"https?://', conteudo or ""):
                  return {"classe": "filme", "motivos": ["conteúdo: vídeo direto (VideoObject), sem lista de episódios"]}

              titulo = extrair_titulo_da_url(url)
              ano = extrair_ano_da_url(url)
              tipo = tmdb_classificar(titulo, ano)

              if tipo == "movie":
                  return {"classe": "filme", "motivos": ["TMDB: movie"]}
              if tipo == "tv":
                  return {"classe": "serie", "motivos": ["TMDB: tv"]}
              return {"classe": "ambos", "motivos": ["sem sinal forte"]}

          def carregar_lista(arq):
              if arq.exists():
                  return [l.strip() for l in arq.read_text(encoding="utf-8").splitlines() if l.strip()]
              return []

          def ordenar(original, adicoes):
              vistos, out = set(), []
              for u in original:
                  if u not in vistos:
                      out.append(u); vistos.add(u)
              for u in sorted(adicoes):
                  if u not in vistos:
                      out.append(u); vistos.add(u)
              return out

          def escrever_atomico(arq, linhas):
              tmp = arq.with_name(arq.name + ".tmp")
              tmp.write_text("\n".join(linhas) + ("\n" if linhas else ""), encoding="utf-8")
              tmp.replace(arq)


          def main():
              if APAGAR_FILAS:
                  log("⚠️ MODO APAGAR: reconstruindo do zero.")
                  filmes_old, series_old = [], []
              else:
                  filmes_old = list(dict.fromkeys(carregar_lista(ARQ_FILA_FILMES)))   # sem duplicadas, mesma ordem
                  series_old = list(dict.fromkeys(carregar_lista(ARQ_FILA_SERIES)))
                  log(f"Filmes atual: {len(filmes_old)} | Séries atual: {len(series_old)}")
              set_f, set_s = set(filmes_old), set(series_old)

              log("Buscando feed...")
              feed, completo = get_all_entries(None if APAGAR_FILAS else (set_f | set_s))
              log(f"📥 {len(feed)} posts lidos do feed" + ("" if completo else " (feed INCOMPLETO)"))
              if not feed:
                  log("❌ Feed vazio, abortando (as filas não foram alteradas).")
                  return
              if APAGAR_FILAS and not completo:
                  log("❌ Feed incompleto no modo APAGAR: abortando para NÃO apagar as filas com dados pela metade.")
                  return

              if not TMDB_KEY:
                  log("⚠️ TMDB_API_KEY ausente.")

              a_class = list(feed.keys()) if APAGAR_FILAS else [u for u in feed if u not in set_f and u not in set_s]
              if not a_class:
                  log("✅ Nada novo.")
                  return

              log(f"🔍 Classificando {len(a_class)} URLs...")
              contagem = {"filme": 0, "serie": 0, "ambos": 0}
              resultado = {}
              total = len(a_class)
              for i, url in enumerate(a_class, 1):          # ordem do feed (mais novo primeiro)
                  info_feed = feed.get(url, {})
                  labels = info_feed.get("labels", set()) if isinstance(info_feed, dict) else set()
                  conteudo = info_feed.get("conteudo", "") if isinstance(info_feed, dict) else ""
                  info = classificar_url(url, labels, conteudo)
                  resultado[url] = info
                  contagem[info["classe"]] += 1
                  if i % 100 == 0 or i == total:
                      log(f"  [{i}/{total}] (🎬 {contagem['filme']} | 📺 {contagem['serie']} | ❓ {contagem['ambos']})")
                      salvar_cache()

              log("\n📊 Resultado:")
              log(f"   🎬 Filmes:   {contagem['filme']}")
              log(f"   📺 Séries:   {contagem['serie']}")
              log(f"   ❓ Ambíguos: {contagem['ambos']} (entram nas DUAS filas)")
              for classe in ("filme", "serie", "ambos"):
                  itens = [(u, info) for u, info in resultado.items() if info["classe"] == classe][:5]
                  if itens:
                      log(f"\n   Amostras {classe.upper()}:")
                      for url, info in itens:
                          log(f"     • {url.split('/')[-1]}")
                          log(f"       {'; '.join(info['motivos'])}")

              # ambíguo -> DUAS filas: o robô de filmes só PULA série (não encaminha), então um ambíguo que seja série
              # sumiria se ficasse só na fila de filmes. Cada robô ainda confere a página.
              novas_f = [u for u in a_class if resultado[u]["classe"] in ("filme", "ambos")]
              novas_s = [u for u in a_class if resultado[u]["classe"] in ("serie", "ambos")]
              # novos NO INÍCIO (posts recentes primeiro), ordem do resto preservada, sem duplicadas
              filme_final = list(dict.fromkeys(novas_f + filmes_old))
              series_final = list(dict.fromkeys(novas_s + series_old))
              escrever_atomico(ARQ_FILA_FILMES, filme_final)
              escrever_atomico(ARQ_FILA_SERIES, series_final)

              f_fin, s_fin = carregar_lista(ARQ_FILA_FILMES), carregar_lista(ARQ_FILA_SERIES)   # totais lidos dos arquivos
              log(f"\n✅ Filmes fila: {len(f_fin)} URLs únicas (+{len(f_fin) - len(filmes_old)})")
              log(f"✅ Séries fila: {len(s_fin)} URLs únicas (+{len(s_fin) - len(series_old)})")
              log(f"   Interseção filmes∩séries: {len(set(f_fin) & set(s_fin))} (os ambíguos)")
              salvar_cache()


          if __name__ == "__main__":
              main()
          PYEOF
          python3 /tmp/atualizar_filas.py

      - name: Salvar arquivos e progresso
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset .github/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nada novo nas filas."
            exit 0
          fi
          git commit -m "chore: atualizar filas (fix titulo + temporada 3+ + ambos só filmes)"

          for i in $(seq 1 5); do
            if git push origin HEAD:main; then break; fi
            echo "Conflito. Sincronizando..."
            git pull origin main --no-rebase -X ours --no-edit
            git add -A
            git reset .github/ 2>/dev/null || true
            git commit -m "chore: retry $i" || true
            sleep $((RANDOM % 10 + 5))
          done
